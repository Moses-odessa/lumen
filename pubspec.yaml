name: lumen
description: "Lumen — игра для изучения языков: словарь как ночное небо."
# Приложение не публикуется в pub.dev.
publish_to: 'none'

version: 0.1.0+1

environment:
  # `-0` — чтобы beta-канал Dart (3.13.0-282.3.beta) попадал в диапазон:
  # проект живёт на beta вслед за athlete_index.
  sdk: ^3.13.0-0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Состояние и навигация (README «Технологии»).
  flutter_riverpod: ^3.4.2
  go_router: ^17.3.0

  # Две базы: user.db через drift_flutter, content.db — отдельным NativeDatabase.
  drift: ^2.34.3
  drift_flutter: ^0.3.1

  # Озвучка верного ответа — часть ядра игры (M1).
  just_audio: ^0.10.5

  # Облако (M6): аккаунт необязателен, без ключей код не активируется.
  supabase_flutter: ^2.16.0

  # Мониторинг крашей: PII выключен, трейсинг 0.
  sentry_flutter: ^9.26.0

  # Прочее из athlete_index без изменений.
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  flutter_local_notifications: ^18.0.1

  # Сетевого клиента в проекте нет до M8 (см. AGENT.md).

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  # Управляемое время в тестах: таймеры забега нельзя проверять паузами.
  fake_async: ^1.3.3
  drift_dev: ^2.34.0
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4
  # Сплеш: экран запуска — это ночное небо, а не белый прямоугольник.
  flutter_native_splash: ^2.4.6

  # Только для tool/ и тестов: сборка read-only контентной БД из YAML.
  sqlite3: ^3.5.2
  yaml: ^3.1.3
  csv: ^6.0.0
  # Хеш исходников в метаданных сборки — вместо метки времени, чтобы
  # пересборка без правок давала байт-в-байт тот же ассет.
  crypto: ^3.0.6

# Экран запуска: тот же зенит неба, что и в теме, чтобы приложение не
# мигало белым перед первым кадром.
flutter_native_splash:
  color: "#05070F"
  image: assets/icon/app_icon_foreground.png
  android_12:
    color: "#05070F"
    image: assets/icon/app_icon_foreground.png
  android: true
  ios: true
  web: false

# Иконка приложения.
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#070B18"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter:
  # Генерация локализаций из ARB. Конфиг — l10n.yaml.
  generate: true

  uses-material-design: true

  assets:
    # Предсобранная read-only контентная БД.
    - assets/content/
    # Озвучка целиком в ассетах: докачка появится только со вторым языком
    # изучения (M8). Манифест лежит рядом с файлами.
    - assets/audio/de/
