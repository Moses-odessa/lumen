# Отдельный редакторский словник; не входной файл текущего контентного пайплайна.
metadata:
  title: "Немецкий: 6000 учебных лексем от A0 до B2"
  version: "1.0"
  created: "2026-09-08"
  language: "de"
  base_variant: "de-DE"
  annotation_language: "ru"
  audience: "Взрослый учащийся: повседневная жизнь, работа, учёба и общественное общение; основной контекст Германия, с учётом DACH."
  status: "editorial_draft"
  total_lexemes: 6000
  topic_count: 24
  native_expert_review: false
  purpose: "Самостоятельное предложение нового словарного пути, не изменение действующего контента Lumen."
  level_policy: "Указан авторский уровень первого планового введения. Это не официальная CEFR-разметка каждой лексемы и не утверждение, что слово нельзя встретить раньше."
  source_policy: "Самостоятельная редакторская подборка. Открытые словники, оглавления учебников и разговорник использованы для тематической и функциональной сверки, а не как база для дословного копирования. Построчная атрибуция источникам не заявляется."
  count_policy: "Считаются только объекты массива lexemes: ровно 6000. Примеры, примечания, формы, цели и ссылки повторения не увеличивают счётчик."
  proficiency_caveat: "6000 записей не гарантируют B2. Нужны грамматика, аудирование, произношение, чтение, письмо, взаимодействие и владение употреблением. Словарная статья, словоформа и семейство слов не являются одной единицей подсчёта."
  scope_caveat: "Это расширенный общеязыковой путь до B2, не обязательный минимум конкретного экзамена. Профессиональные и абстрактные слова сначала могут осваиваться для узнавания."
  review_caveat: "Количество, структура, ссылки и повторы проверяются автоматически; полная словарная, семантическая и корпусная проверка всех 6000 статей не выполнена. Перед выпуском курса нужна проверка преподавателем DaF и носителем."
counting_rules:
  - "Одна базовая запись на выбранную лемму. Не добавляются спряжения, падежные формы и регулярные степени сравнения ради количества."
  - "Разные значения одной графической леммы обычно расширяют существующую запись: Bank, Absatz, Punkt. Поэтому число не равно количеству всех словарных значений немецкого языка."
  - "Пять явно разных пар сохранены раздельно: essen/Essen, morgen/Morgen, weg/Weg, arm/Arm, recht/Recht. У них разные части речи и учебные значения."
  - "Регулярные грамматические формы вроде die/das/den/dem для артикля der, mehr для viel, wessen для wer включаются в работу с базовой записью, а не в счётчик."
  - "Производные слова и полезные устойчивые сложные слова допускаются как лексемы: это не подсчёт корней или словообразовательных семейств."
  - "Выборочные женские названия профессий и ролей являются отдельными лексемами; полный набор пар искусственно не разворачивается. Остальные формы включать в задания по потребности."
  - "Существительное имеет артикль; gender=null и number=plural означают запись во множественном числе. Субстантивированные прилагательные с артиклем требуют склонения."
  - "Глагол дан в инфинитиве; sich обозначает выбранное возвратное употребление, не отдельную новую единицу. У некоторых глаголов возвратное и переходное употребления показаны в usage."
  - "Часть речи у многозначного слова относится к выбранному начальному употреблению; позднейшие значения и функции добавляются контекстно."
  - "Одна основная тема назначена для организации файла, но не запрещает использование слова в других темах."
  - "Устойчивые конструкции и сочетания, приведённые в learning_design, обучаются вместе со словами, но не входят в 6000."
schema:
  id: "Уникальный идентификатор статьи в версии 1.0; не идентификатор действующей базы приложения."
  level: "Уровень первого введения: A0, A1, A2, B1 или B2."
  topic: "Основная тема: id из topics."
  lemma: "Немецкая базовая форма, UTF-8/NFC; для существительных регистр значим."
  pos: "noun, verb, adj, adv, pronoun, determiner, article, preposition, conjunction, particle, interjection или number."
  article: "Для существительных: der, die или das. Региональные альтернативы не всегда исчерпывающе перечислены."
  gender: "m, f, n; null у множественного числа без назначения единственного рода."
  number: "plural только для существительных, представленных во множественном числе."
  note: "Необязательное ограничение значения, вариант или пояснение подсчёта."
  usage: "Необязательные авторские сочетания, не входят в число лексем."
learning_design:
  sequence: "Проходить уровни последовательно. Внутри уровня чередовать ситуации, а не заучивать весь список одной части речи; порядок строк внутри темы алфавитный по группе части речи, это не порядок отдельных уроков."
  spiral: "На каждом новом уровне возвращать слова предыдущего уровня в более сложной задаче. recycle_ids являются небольшими опорными примерами повторения, а не полным расписанием повторов."
  lesson_size: "Проектная рекомендация: около 8–12 новых единиц на короткий блок; объём уменьшать при слабом воспроизведении, увеличивать только по результату."
  lesson_mix: "Собирать блок вокруг намерения: существительные + глаголы + признаки + служебные слова из разных тем. Не превращать блок в длинный перечень предметов."
  practice: "Для каждой единицы добавить выбранное значение, аудио, один понятный контекст, воспроизведение по ситуации и использование в короткой реплике."
  review: "Повторять прежние слова в новых контекстах; проверять отсроченное воспроизведение, а не только узнавание карточки."
  receptive_productive: "Сначала продуктивно закреплять частотные бытовые слова и универсальные связки. Более узкую лексику вводить рецептивно и активировать по задачам учащегося; индивидуальные приоритеты в этом файле не размечены."
  compound_policy: "Показывать строение сложных слов и перенос смысла известных компонентов; не требовать одинакового числа повторов от прозрачного сложного слова и совершенно новой основы."
  exercise_quality: "Не использовать нормативные родовые/региональные варианты и допустимые синонимы как заведомо неправильные ответы. Сначала зафиксировать значение и ситуацию."
  uncounted_chunks:
    - "Wie geht es dir?"
    - "Ich hätte gern ..."
    - "Könnten Sie das bitte wiederholen?"
    - "einen Termin vereinbaren"
    - "sich um eine Stelle bewerben"
    - "sich auf etwas beziehen"
    - "einerseits ... andererseits ..."
    - "Meiner Meinung nach ..."
    - "auswendig lernen"
    - "rückwärts fahren"
    - "sauber halten"
    - "instand halten"
    - "instand setzen"
  integration: "Не импортировать файл напрямую в рабочие карточки: нужны переводы выбранных значений, валентность, формы множественного числа, примеры, аудио и проверка заданий."
levels:
  A0:
    new_lexemes: 343
    cumulative_lexemes: 343
    focus: "Вход в язык: короткие реплики, знакомые предметы, основные действия. A0 здесь означает продуктовый вводный этап, приблизительно Pre-A1."
  A1:
    new_lexemes: 741
    cumulative_lexemes: 1084
    focus: "Простое бытовое общение, покупки, маршруты, семья, распорядок и цифровые действия."
  A2:
    new_lexemes: 1604
    cumulative_lexemes: 2688
    focus: "Связное описание знакомых ситуаций, договорённости, услуги, личный опыт и решение типовых проблем."
  B1:
    new_lexemes: 1979
    cumulative_lexemes: 4667
    focus: "Самостоятельное общение, объяснение выбора, работа, учёба, общественная жизнь и понимание связных текстов."
  B2:
    new_lexemes: 1333
    cumulative_lexemes: 6000
    focus: "Развёрнутая аргументация, критическая оценка информации и более точное обсуждение общественных и профессиональных тем."
