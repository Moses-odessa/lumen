sources:
  -
    id: "cefr"
    title: "Council of Europe: Common European Framework of Reference for Languages"
    url: "https://rm.coe.int/16802fc1bf"
    use: "Ориентир коммуникативных умений; не источник обязательной численности словаря."
  -
    id: "goethe_a1"
    title: "Goethe-Institut: Start Deutsch 1, Wortliste"
    url: "https://www.goethe.de/pro/relaunch/prf/de/A1_SD1_Wortliste_02.pdf"
    use: "Ориентир повседневных ситуаций и начального лексического охвата, без воспроизведения списка целиком."
  -
    id: "goethe_a2"
    title: "Goethe-Institut: Goethe-Zertifikat A2, Wortliste"
    url: "https://www.goethe.de/pro/relaunch/prf/de/Goethe-Zertifikat_A2_Wortliste.pdf"
    use: "Ориентир расширения бытового общения; экзаменационный список не равен полному учебному плану."
  -
    id: "goethe_b1"
    title: "Goethe-Institut: Goethe-Zertifikat B1, Wortliste"
    url: "https://www.goethe.de/pro/relaunch/prf/de/Goethe-Zertifikat_B1_Wortliste.pdf"
    use: "Ориентир самостоятельного общения, общественных и рабочих ситуаций."
  -
    id: "momente"
    title: "Hueber: Momente B1.2, Kursbuch, Inhaltsverzeichnis"
    url: "https://legacy.hueber.de/media/36/Momente_KB_B1_2_Inhalt.pdf"
    use: "Открытое оглавление учебника: связь жизненных ситуаций с коммуникативными задачами; полный учебник не копировался."
  -
    id: "sicher"
    title: "Hueber: Sicher! aktuell B2, Inhaltsverzeichnis"
    url: "https://shop.hueber.de/media/hueber_dateien/Internet_Inhaltsverz/Red1/9783193012074_Inhalt.pdf"
    use: "Открытое оглавление учебника: тематическая глубина B2 и переход к обсуждению, сравнению и оценке."
  -
    id: "phrasebook"
    title: "Wikivoyage: German phrasebook"
    url: "https://en.wikivoyage.org/wiki/German_phrasebook"
    use: "Публичный разговорник: проверка охвата практических ситуаций в поездке. Фразы не воспроизводятся."
  -
    id: "bsi_security"
    title: "BSI: Unterrichts- und Gesprächseinstiege"
    url: "https://www.bsi.bund.de/DE/Themen/Verbraucherinnen-und-Verbraucher/Informationen-und-Empfehlungen/Sicher-im-digitalen-Schulalltag/Unterrichts-und-Gespraechseinstiege/Unterrichts-und-Gespraechseinstiege.html"
    use: "Актуальная цифровая безопасность: проверка информации, фишинг, защита учётной записи."
  -
    id: "bsi_ai"
    title: "BSI: Künstliche Intelligenz"
    url: "https://www.bsi.bund.de/DE/Themen/Verbraucherinnen-und-Verbraucher/Informationen-und-Empfehlungen/Technologien_sicher_gestalten/Kuenstliche-Intelligenz/kuenstliche_intelligenz.html"
    use: "Дополнение классических тем: ИИ, генерация информации, риски и дипфейки."
  -
    id: "duden_orthography"
    title: "Duden: instand halten / instand setzen"
    urls:
      - "https://www.duden.de/rechtschreibung/instand_halten"
      - "https://www.duden.de/rechtschreibung/instand_setzen"
    use: "Точечная проверка спорных написаний. Эти конструкции вынесены из счётчика отдельных лемм."

