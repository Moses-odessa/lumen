    issue: "freq_rank нельзя воспроизвести по указанным источникам"
    evidence: "Все 864 ранга кратны десяти, а комментарии ссылаются на частотные списки по субтитрам без корпуса, версии и процедуры; генератор калибровки использует эти ранги."
