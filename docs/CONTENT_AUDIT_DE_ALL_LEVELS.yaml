systemic_findings:
  -
    priority: "P1"
    issue: "Нет единственного ответа в части фраз"
    evidence: "Режим phrase показывает шаблон и register, подставляя near основного концепта и слова соседей; near проектировались для перевода слова, а не для конкретного предложения."
    file: "lib/features/game/application/question_builder.dart"
    line: 70
    examples:
      - "city_a0_map"
      - "shop_a1_quality"
      - "home_a2_landlord"
      - "work_b1_atmosphere"
      - "family_b2_childwelfare"
    recommendation: "Задать смысловую подсказку и/или собственный проверенный набор вариантов для каждой фразы; проверить итоговый набор, включая резервные варианты, а не только answer."
  -
    priority: "P1"
    issue: "Множественное число подменяется производным словом"
    examples:
      - "Milch -> Milchsorten"
      - "Gepäck -> Gepäckstücke"
      - "Unterhalt -> Unterhaltszahlungen"
      - "Zeitmanagement -> Zeitmanagementmethoden"
    recommendation: "Хранить формы только выбранной леммы и значения; единицы/порции/разновидности при необходимости оформить отдельными конструкциями."
  -
    priority: "P1"
    issue: "Синонимы и широкие переводы создают несколько правильных вариантов"
    examples:
      - "Abendessen / Abendbrot"
      - "jetzt / jetzo"
      - "Zustimmung / Einwilligung"
      - "Reha / Rehabilitation"
    recommendation: "Сначала согласовать смысл EN/RU/DE, затем строить варианты; спорные родо-видовые отношения требуют контекста и помечены doubt."
  -
    priority: "P1"
    issue: "Ярусы плохо отражают общую языковую компетенцию"
    evidence: "838 из 864 концептов являются существительными, глагольных целей нет; B2 преимущественно юридический и административный словарь."
    recommendation: "Разделить общий словарь, жизненные сценарии и специальную терминологию; рекомендации подробно изложены в CONTENT_CURRICULUM_REVIEW.md."
  -
