# Конфигурация анализатора. Копия из athlete_index (README «Технологии»).
analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # Сгенерированный код Drift и локализаций.
    - lib/**/*.g.dart
    - lib/core/l10n/app_localizations*.dart
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Домен — чистый Dart, печать в консоль только через AnalyticsService.
    avoid_print: true
