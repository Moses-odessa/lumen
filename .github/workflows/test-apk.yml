name: Build test APK

# Ручной запуск: Actions → Build test APK → Run workflow.
# Собирает release-APK с debug-подписью (без keystore и секретов) — ставится
# на телефон для проверки. Для магазина используется «Release APK».
on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.0-0.3.pre'
  FLUTTER_CHANNEL: 'beta'

jobs:
  build:
    name: Build test APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - run: flutter pub get
      - name: Code generation (Drift, l10n)
        run: |
          dart run build_runner build
          flutter gen-l10n

      # Контентная база — часть ассетов, без неё приложение не играет.
      - name: Build content database
        run: dart run tool/build_content.dart --lang de

      # --split-per-abi: отдельный APK на архитектуру вместо universal.
      # Убирает нативные библиотеки чужих ABI — размер падает примерно втрое.
      # Порог по README: APK должен укладываться в 55 МБ вместе с озвучкой.
      - name: Build APK (release, debug-signed, per-ABI)
        run: >
          flutter build apk --release --split-per-abi
          --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}

      - name: Report APK sizes
        run: ls -lh build/app/outputs/flutter-apk/*.apk

      # arm64-v8a подходит практически всем современным телефонам.
      - uses: actions/upload-artifact@v7
        with:
          name: test-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
