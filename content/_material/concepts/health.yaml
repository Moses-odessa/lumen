# Созвездие «Тело, здоровье и помощь» — эталонное. Написано целиком на всех
# пяти ярусах, чтобы измерить реальную цену контента и умножить на 30
# (docs/PLAN_M0_M8.md, M4).
#
# Созвездие переименовано при импорте словника: тема называется так, как её
# называет словник. Иначе матчнутый концепт принадлежал бы двум созвездиям
# сразу и «тема» в проекте значила бы две разные вещи. Идентификаторы
# концептов и фраз при этом сохранили старый префикс (doctor_…) — они ключи,
# по которым у игрока лежит память о слове, и переименование стёрло бы
# прогресс всем, кто уже играл.
#
# TODO(data): вычитан носителем только ярус A0 (см. content/launch.yaml).
# Ярусы A1–B2 написаны, но до вычитки не запускаются — правило «лучше меньше
# ярусов, чем плохие» из docs/CONTENT_PIPELINE.md.
#
# Источники: Goethe/ÖSD Wortlisten A1–B1 для ярусов A0–A2, частотные списки
# по субтитрам для freq_rank, немецкая медицинско-страховая терминология
# (Krankenkasse, Widerspruch, Zuzahlung) для B1–B2.
