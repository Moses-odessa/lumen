# Созвездие «У врача». Ярусы задают, какие концепты добавляются на каком
# уровне; размер накопительный — 12 / 24 / 48 / 72 / 96 звёзд.
#
# TODO(data): написан только ярус A0 (12 звёзд) — этого достаточно, чтобы
# собрать content.db и запустить ядро игры на M1. Ярусы A1–B2 приходят на M4
# вместе с частотными списками и профилями Goethe/ÖSD.
constellation: doctor
tiers:
  a0:
    concepts:
      - { id: doctor_person, pos: noun, freq_rank: 1120 }
