      - { id: head_body, pos: noun, freq_rank: 640 }
      - { id: belly_body, pos: noun, freq_rank: 2310 }
      - { id: hand_body, pos: noun, freq_rank: 520 }
      - { id: fever_noun, pos: noun, freq_rank: 3480 }
      - { id: medicine_noun, pos: noun, freq_rank: 2760 }
      - { id: pharmacy_place, pos: noun, freq_rank: 3150 }
      - { id: hospital_place, pos: noun, freq_rank: 1980 }
