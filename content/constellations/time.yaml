# Созвездие «Время» — сутки, календарь, часы.
#
# Написан только ярус A0: 12 звёзд. Остальные ярусы появятся, когда A0
# нескольких созвездий будет вычитан — сначала вширь, потом вглубь
# (docs/CONTENT_PIPELINE.md).
