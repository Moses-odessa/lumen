    - id: work_change_b2_01
      text: "Berufserfahrung ersetzt nicht immer systematisches Lernen."
    - id: work_change_b2_02
      text: "Mir ist wichtig zu verstehen, warum diese Veränderung nötig ist."
    - id: work_change_b2_03
      text: "Neue Aufgaben sollten mit Unterstützung verbunden sein."
    - id: work_change_b2_04
      text: "Flexible Arbeitszeiten bedeuten nicht ständige Erreichbarkeit."
    - id: work_change_b2_05
      text: "Produktivität sollte nicht allein an der Stundenzahl gemessen werden."
    - id: work_change_b2_06
      text: "Welche Kompetenz werden wir künftig brauchen?"
    - id: work_change_b2_07
      text: "Lernen sollte mit konkreten Aufgaben verbunden sein."
    - id: work_change_b2_08
      text: "Fehler können eine Lernquelle sein, wenn man sie analysiert."
    - id: work_change_b2_09
      text: "Konkretes Feedback ist mir wichtiger als allgemeines Lob."
    - id: work_change_b2_10
      text: "Der Übergang sollte schrittweise und planbar sein."
    - id: work_change_b2_11
      text: "Wir müssen bewahren, was bereits funktioniert."
    - id: work_change_b2_12
      text: "Nicht jede neue Technologie löst ein tatsächliches Problem."
    - id: work_change_b2_13
      text: "Ich möchte verstehen, wie mein Fortschritt bewertet wird."
    - id: work_change_b2_14
      text: "Wird die Lernzeit in den Arbeitsplan aufgenommen?"
    - id: work_change_b2_15
      text: "Der neue Ablauf sollte zunächst mit einer kleinen Gruppe getestet werden."
    - id: work_change_b2_16
      text: "Wir müssen erklären, welche Aufgaben sich ändern und welche bleiben."
    - id: work_change_b2_17
      text: "Widerstand gegen Veränderungen kann auf fehlende Klarheit statt auf mangelnde Motivation hinweisen."
    - id: work_change_b2_18
      text: "Ich hätte gern ein Beispiel dafür, was ich verbessern kann."
    - id: work_change_b2_19
      text: "Ein einzelner Fehler sollte nicht die gesamte Leistungsbewertung bestimmen."
    - id: work_change_b2_20
      text: "Wissen bleibt im Team, wenn die Abläufe dokumentiert sind."
    - id: work_change_b2_21
      text: "Lässt sich Mentoring mit selbstständiger Praxis verbinden?"
    - id: work_change_b2_22
      text: "Die ersten Ergebnisse sollten vor der vollständigen Einführung besprochen werden."
    - id: work_change_b2_23
      text: "Um uns an die neue Software zu gewöhnen, müssen wir eine kurze Schulung absolvieren."
