    - id: work_change_b2_24
      text: "Ich möchte meine Verhandlungsfähigkeiten ausbauen, damit ich Konditionen selbstbewusster besprechen kann."
      kind: example
    - id: work_change_b2_25
      text: "Die Herausforderung besteht darin, die laufenden Aufgaben mit der Zeit fürs Lernen zu vereinbaren."
      kind: example
    - id: work_change_b2_26
      text: "Statt nur die Geschwindigkeit zu bewerten, sollten wir auch die Qualität des Ergebnisses berücksichtigen."
      kind: example
    - id: work_change_b2_27
      text: "Der Erfolg der Umstellung wird davon abhängen, wie verständlich wir die neuen Abläufe erklären."
      kind: example
    - id: work_change_b2_28
      text: "Meine bisherigen Erfahrungen haben gezeigt, dass kleine, regelmäßige Veränderungen besser funktionieren als abrupte."
      kind: example
    - id: work_change_b2_29
