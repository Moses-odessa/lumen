lang: de
constellation: society_rights
name: "Gesellschaft und Rechte"
tiers:
  b2:
    - id: society_rights_b2_01
      text: "Die Regel sollte für alle gleichermaßen gelten."
    - id: society_rights_b2_02
      text: "Gleichbehandlung bedeutet nicht immer gleiche Chancen."
    - id: society_rights_b2_03
      text: "Es ist wichtig, die unmittelbar Betroffenen anzuhören."
    - id: society_rights_b2_04
      text: "Welche Gruppen könnten übersehen werden?"
    - id: society_rights_b2_05
      text: "Die Entscheidung muss für die Bürger nachvollziehbar sein."
    - id: society_rights_b2_06
      text: "Ich möchte die rechtliche Grundlage verstehen."
    - id: society_rights_b2_07
      text: "An wen kann man sich mit einer Beschwerde wenden?"
    - id: society_rights_b2_08
      text: "Eine Entscheidung zu kritisieren bedeutet nicht, die Person zu missachten."
    - id: society_rights_b2_09
      text: "Wir können widersprechen, ohne persönlich zu werden."
    - id: society_rights_b2_10
      text: "Barrierefreiheit muss unterschiedliche Bedürfnisse berücksichtigen."
    - id: society_rights_b2_11
      text: "Ein Verbot allein reicht möglicherweise nicht aus."
    - id: society_rights_b2_12
      text: "Es braucht nicht nur Regeln, sondern auch Möglichkeiten, sie einzuhalten."
    - id: society_rights_b2_13
      text: "Das Formular sollte mit Bildschirmleseprogrammen nutzbar sein."
    - id: society_rights_b2_14
      text: "Man darf nicht davon ausgehen, dass alle ein Smartphone benutzen."
    - id: society_rights_b2_15
      text: "Es muss erklärt werden, wie man Widerspruch einlegen kann."
    - id: society_rights_b2_16
      text: "Gibt es eine unabhängige Stelle, die solche Beschwerden prüft?"
    - id: society_rights_b2_17
      text: "Die Diskussion sollte vor der Entscheidung stattfinden."
    - id: society_rights_b2_18
      text: "Die Vertretung einer Gruppe bedeutet nicht, dass alle ihre Mitglieder gleich denken."
    - id: society_rights_b2_19
      text: "Gibt es Unterstützung für Menschen, denen das Ausfüllen des Antrags schwerfällt?"
    - id: society_rights_b2_20
      text: "Transparente Kriterien helfen, willkürliche Entscheidungen zu vermeiden."
    - id: society_rights_b2_21
      text: "Die Regeln müssen in verständlicher Sprache formuliert werden."
    - id: society_rights_b2_22
      text: "Der Zugang zu dieser Dienstleistung sollte nicht vom Wohnort abhängen."
    - id: society_rights_b2_23
      text: "Aus Sicht der Chancengleichheit ist es wichtig, den kostenlosen Zugang zum Kurs zu erhalten."
      kind: example
    - id: society_rights_b2_24
      text: "Diese Entscheidung wird besonders Menschen betreffen, die weit vom Zentrum entfernt wohnen."
      kind: example
    - id: society_rights_b2_25
      text: "Wir müssen sicherstellen, dass die Informationen auch Menschen ohne Internetzugang erreichen."
      kind: example
    - id: society_rights_b2_26
      text: "Die Frage ist, wer das Recht hat, im Namen der Anwohner Entscheidungen zu treffen."
      kind: example
    - id: society_rights_b2_27
      text: "Die Freiheit, seine Meinung zu äußern, muss mit Respekt vor anderen einhergehen."
      kind: example
    - id: society_rights_b2_28
      text: "Ich unterstütze das Ziel, den Lärm zu verringern, habe aber Zweifel an der Zweckmäßigkeit eines vollständigen Verbots."
      kind: example
    - id: society_rights_b2_29
      text: "Damit Beteiligung sinnvoll ist, braucht es die Möglichkeit, Entscheidungen tatsächlich zu beeinflussen."
      kind: example
    - id: society_rights_b2_30
      text: "Es wäre unfair, Menschen von der Diskussion auszuschließen, wenn die Entscheidung sie unmittelbar betrifft."
      kind: example
