# Фразы созвездия «Люди, семья и отношения» на немецком.
#
# Фраза принадлежит языку изучения, а не концепту: немецкое
# предложение нельзя положить в язык-нейтральный файл. Переводы фраз
# на родные языки лежат в content/lang/<код>.yaml, секция phrases.
lang: de
constellation: people
