name: "Umwelt und Kosten"
tiers:
  b2:
    - id: ecology_decisions_b2_01
      text: "Umweltmaßnahmen müssen fair und bezahlbar sein."
    - id: ecology_decisions_b2_02
      text: "Der gesamte Lebenszyklus des Produkts muss berücksichtigt werden."
    - id: ecology_decisions_b2_03
      text: "Ein niedriger Preis spiegelt nicht immer die tatsächlichen Kosten wider."
    - id: ecology_decisions_b2_04
      text: "Wer trägt die Kosten des Übergangs?"
    - id: ecology_decisions_b2_05
      text: "Individuelle Entscheidungen sind wichtig, ersetzen aber keine strukturellen Veränderungen."
    - id: ecology_decisions_b2_06
      text: "Der langfristige Nutzen kann die Anfangskosten übersteigen."
    - id: ecology_decisions_b2_07
      text: "Wir brauchen messbare Ziele."
    - id: ecology_decisions_b2_08
      text: "Wie prüfen wir, ob diese Maßnahme wirkt?"
    - id: ecology_decisions_b2_09
      text: "Man sollte das Problem nicht bloß an einen anderen Ort verlagern."
    - id: ecology_decisions_b2_10
      text: "Die versprochene Wirkung hängt von den Nutzungsbedingungen ab."
    - id: ecology_decisions_b2_11
      text: "Man muss tatsächliche Veränderungen von Werbung unterscheiden."
    - id: ecology_decisions_b2_12
      text: "Auch die möglichen Folgen des Nichtstuns haben ihren Preis."
    - id: ecology_decisions_b2_13
      text: "Wir müssen die Auswirkungen der Herstellung berücksichtigen, nicht nur die der Nutzung."
    - id: ecology_decisions_b2_14
      text: "Wie lange muss das Produkt halten, damit sich der Ersatz rechtfertigen lässt?"
    - id: ecology_decisions_b2_15
      text: "Diese Bewertung berücksichtigt den Transport nicht."
    - id: ecology_decisions_b2_16
      text: "Lokale Herstellung garantiert allein noch keine geringeren Auswirkungen."
    - id: ecology_decisions_b2_17
      text: "Wir sollten prüfen, was dieses Umweltsiegel genau bedeutet."
    - id: ecology_decisions_b2_18
      text: "Die Einsparungen können entfallen, wenn der Verbrauch steigt."
    - id: ecology_decisions_b2_19
      text: "Wer wird die Einhaltung der Umweltzusagen überwachen?"
    - id: ecology_decisions_b2_20
      text: "Der Plan sollte überprüfbare Zwischenziele enthalten."
    - id: ecology_decisions_b2_21
      text: "Die Veränderungen sollten nicht die gesamte Last auf die Verbraucher verlagern."
    - id: ecology_decisions_b2_22
      text: "Der Vergleich muss dieselbe Nutzungsdauer berücksichtigen."
    - id: ecology_decisions_b2_23
      text: "Beim Vergleich von Reparatur und Ersatz müssen wir den Ressourcenverbrauch berücksichtigen."
      kind: example
    - id: ecology_decisions_b2_24
      text: "Der Umweltvorteil entfällt, wenn das neue System mehr Ressourcen verbraucht, als es einspart."
      kind: example
    - id: ecology_decisions_b2_25
      text: "Der Umstieg auf Elektrobusse wird eine neue Ladeinfrastruktur erfordern."
      kind: example
    - id: ecology_decisions_b2_26
      text: "Um die Ungleichheit nicht zu verschärfen, sollten wir Familien mit geringem Einkommen unterstützen."
      kind: example
    - id: ecology_decisions_b2_27
      text: "Je nach den örtlichen Bedingungen kann das Ergebnis deutlich unterschiedlich ausfallen."
      kind: example
    - id: ecology_decisions_b2_28
      text: "Die Kosten der Wärmedämmung sollten mit den erwarteten Energieeinsparungen verglichen werden."
      kind: example
    - id: ecology_decisions_b2_29
      text: "Ohne Änderungen am Verkehrssystem werden wir Staus kaum deutlich reduzieren können."
      kind: example
    - id: ecology_decisions_b2_30
      text: "Diese Maßnahme ergibt nur Sinn, wenn die Anwohner die vorgeschlagene Alternative nutzen können."
      kind: example
