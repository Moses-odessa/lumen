# Созвездие «Покупки, одежда и вещи».
#
# Созвездие переименовано при импорте словника: тема называется так, как её
# называет словник. Иначе матчнутый концепт принадлежал бы двум созвездиям
# сразу и «тема» в проекте значила бы две разные вещи. Идентификаторы
# концептов и фраз при этом сохранили старый префикс (shop_…) — они ключи,
# по которым у игрока лежит память о слове, и переименование стёрло бы
# прогресс всем, кто уже играл.
#
# Написан только ярус A0: 12 звёзд. Остальные ярусы появятся, когда A0
# нескольких созвездий будет вычитан — сначала вширь, потом вглубь
# (docs/CONTENT_PIPELINE.md).
#
# TODO(data): вычитка носителем не проводилась, ярус запущен на тех же
# основаниях, что A0 «Врача», — см. content/launch.yaml.
#
