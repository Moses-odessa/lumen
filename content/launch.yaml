# Какие ярусы языка считаются запущенными.
#
# Правило пайплайна: язык не запускается, пока его ярусы не вычитаны
# (docs/CONTENT_PIPELINE.md). Этот файл делает правило машинным: валидатор
# требует полноты только для перечисленных здесь ярусов, а всё остальное
# честно объявляет ненаписанным.
#
# Приложение тоже читает это ограничение: ярус выше запущенного не
# предлагается ни калибровкой, ни подъёмом.
#
# ВНИМАНИЕ: содержимое яруса сменилось целиком. Игра стала разговорником, и
# корпус импортирован из content/_import/phrasebook_1000 — 1000 фраз на пяти
# языках, 50 тем по двадцать фраз. Семнадцать прежних записей о вычитке
# описывали словарный контент (864 слова и 432 предложения с пропусками),
# которого больше не существует; хранить их означало бы утверждать, что
# прочитан текст, которого нет. Записи удалены, а не переписаны.
#
# TODO(data): вычитка нового корпуса не проводилась. Валидатор об этом
# говорит прямо — «нынешний текст прочитан целиком 0 разными моделями,
# нужно 2», — и это правильный ответ, а не поломка проверки.

de:
  # Ярус запущен по решению автора проекта: играть по непрочитанному
  # временно разрешено, чтобы проверить механику на живом человеке.
  launched: [a0]
  drafted: [a1, a2, b1, b2]

  reviewers:
    a0:
      by: 'импорт content/_import/phrasebook_1000; вычитка не проводилась'
      constellations:
        [about_me, first_contact, needs_help, place_time_price, understanding]
      passes: []
    a1:
      by: 'импорт content/_import/phrasebook_1000; вычитка не проводилась'
      constellations:
        [cafe_food, daily_routine, health_doctor, people_family, plans_invitations, shopping_payment, study_contact, transport, travel_hotel]
      passes: []
    a2:
      by: 'импорт content/_import/phrasebook_1000; вычитка не проводилась'
      constellations:
        [arrangements, comparison_conditions, digital_life, feelings_support, housing_repairs, learning_how, past_stories, returns_delivery, symptoms_treatment, travel_trouble, work_search]
      passes: []
    b1:
      by: 'импорт content/_import/phrasebook_1000; вычитка не проводилась'
      constellations:
        [advice_decisions, agree_object, clarify_mediate, culture_impressions, ecology_mobility, health_lifestyle, history_consequences, letters_requests, money_contracts, opinion_reasons, relations_boundaries, teamwork]
      passes: []
    b2:
      by: 'импорт content/_import/phrasebook_1000; вычитка не проводилась'
      constellations:
        [ai_information, argument_building, ecology_decisions, hedging, idioms_speech, meetings_decisions, negotiation, persuasion, presentations_data, society_rights, sources_evidence, summary_rethink, work_change]
      passes: []
