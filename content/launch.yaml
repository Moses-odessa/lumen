# Какие ярусы языка считаются запущенными.
#
# Правило пайплайна: язык не запускается, пока его ярусы не вычитаны
# человеком (docs/CONTENT_PIPELINE.md). Этот файл делает правило машинным:
# валидатор требует полноты — размеров созвездий, озвучки, набора
# калибровки — только для перечисленных здесь ярусов, а всё остальное
# честно объявляет ненаписанным.
#
# Приложение тоже читает это ограничение: ярус выше запущенного не
# предлагается ни калибровкой, ни подъёмом.
#
# Добавлять ярус сюда можно только после сплошной вычитки носителем.
# Лучше три хороших яруса, чем двадцать сгенерированных.
#
# Запись о вычитке обязана перечислять созвездия поимённо, и валидатор
# сверяет этот список с составом яруса. Раньше здесь была свободная строка —
# она разошлась с контентом молча: созвездий стало девять вместо пяти, а
# строку никто не поправил, и 48 концептов запущенного A0 уезжали игроку не
# прочитанными никем.

de:
  # TODO(data): A0 вычитан автором проекта и модельной вычиткой, но НЕ
  # носителем. Перед публикацией в сторы (M7) нужна проверка носителем
  # немецкого.
  launched: [a0]

  # Ярусы, для которых контент написан, но вычитки не было. Валидатор
  # проверяет их структуру, но не требует полноты.
  drafted: [a1, a2, b1, b2]

  reviewers:
    a0:
      by: 'автор проекта и модельная вычитка; носитель не привлекался'
      constellations:
        [doctor, food, transport, home, shop, family, time, city, work]

en:
  # Английский как язык ИЗУЧЕНИЯ — второй. Именно он когда-то включил
  # докачку аудио (M8); докачка с тех пор удалена вместе с хостингом, и
  # вся озвучка снова едет в ассетах. По измеренной цене AAC-LC полный курс
  # языка — около 24 МБ, и до четвёртого языка это помещается в APK.
  #
  # Он почти бесплатен: концепты общие, английские лексемы уже написаны как
  # язык подсказок. Дописать пришлось только дистракторы и озвучку — это и
  # есть та самая линейная стоимость нового языка из CONTENT_PIPELINE.md.
  #
  # TODO(data): вычитка носителем английского не проводилась.
  launched: [a0]
  drafted: [a1, a2, b1, b2]

  reviewers:
    a0:
      by: 'автор проекта (не носитель); английский вычитан как язык
        подсказок, не как язык изучения'
      constellations:
        [doctor, food, transport, home, shop, family, time, city, work]
