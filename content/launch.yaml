# Какие ярусы языка считаются запущенными.
#
# Правило пайплайна: язык не запускается, пока его ярусы не вычитаны
# человеком (docs/CONTENT_PIPELINE.md). Этот файл делает правило машинным:
# валидатор требует полноты — размеров созвездий, озвучки, набора
# калибровки — только для перечисленных здесь ярусов, а всё остальное
# честно объявляет ненаписанным.
#
# Приложение тоже читает это ограничение: ярус выше запущенного не
# предлагается ни калибровкой, ни подъёмом.
#
# Добавлять ярус сюда можно только после сплошной вычитки носителем.
# Лучше три хороших яруса, чем двадцать сгенерированных.

de:
  # TODO(data): A0 написан и вычитан автором проекта, но НЕ носителем.
  # Перед публикацией в сторы (M7) нужна проверка носителем немецкого.
  launched: [a0]

  # Ярусы, для которых контент написан, но вычитки не было. Валидатор
  # проверяет их структуру, но не требует полноты.
  drafted: [a1, a2, b1, b2]

  reviewers:
    a0: 'автор проекта (не носитель)'

en:
  # Английский как язык ИЗУЧЕНИЯ — второй, и именно он по правилам проекта
  # включает докачку аудио (M8): два языка в ассетах это уже под сотню
  # мегабайт, и дальше линейно хуже.
  #
  # Он почти бесплатен: концепты общие, английские лексемы уже написаны как
  # язык подсказок. Дописать пришлось только дистракторы и озвучку — это и
  # есть та самая линейная стоимость нового языка из CONTENT_PIPELINE.md.
  #
  # TODO(data): вычитка носителем английского не проводилась.
  launched: [a0]
  drafted: [a1, a2, b1, b2]

  reviewers:
    a0: 'автор проекта (не носитель)'
