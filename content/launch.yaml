# Какие ярусы языка считаются запущенными.
#
# Правило пайплайна: язык не запускается, пока его ярусы не вычитаны
# человеком (docs/CONTENT_PIPELINE.md). Этот файл делает правило машинным:
# валидатор требует полноты — размеров созвездий, озвучки, набора
# калибровки — только для перечисленных здесь ярусов, а всё остальное
# честно объявляет ненаписанным.
#
# Приложение тоже читает это ограничение: ярус выше запущенного не
# предлагается ни калибровкой, ни подъёмом.
#
# Добавлять ярус сюда можно только после сплошной вычитки.
# Лучше три хороших яруса, чем двадцать сгенерированных.
#
# ВНИМАНИЕ: правило вычитки изменено — носитель больше не требуется, вместо
# него перекрёстная проверка независимыми агентами (PLAN.md, «Вычитка»).
# Машинную форму этого правила — два прохода разными моделями и хеш
# содержимого в записи о проверке — приносит веха M13. До неё записи ниже
# описывают то, что было сделано фактически, и слово «носитель» в них
# читается как «этого не делали и делать не будем».
#
# Запись о вычитке обязана перечислять созвездия поимённо, и валидатор
# сверяет этот список с составом яруса. Раньше здесь была свободная строка —
# она разошлась с контентом молча: созвездий стало девять вместо пяти, а
# строку никто не поправил, и 48 концептов запущенного A0 уезжали игроку не
# прочитанными никем.

de:
  # TODO(data): A0 вычитан автором проекта и модельной вычиткой, но НЕ
  # носителем. Перед публикацией в сторы (M7) нужна проверка носителем
  # немецкого.
  launched: [a0]

  # Ярусы, которые прошли модельную вычитку, но НЕ запущены. Их держит не
  # текст, а два обстоятельства: нет озвучки и нет вычитки носителем.
  # Валидатор проверяет их структуру, но не требует полноты.
  drafted: [a1, a2, b1, b2]

  # Запись есть у каждого яруса, а не только у запущенных: она говорит, что
  # с ярусом делали. Проверку покрытия валидатор требует от запущенных.
  reviewers:
    a0:
      by: 'автор проекта и модельная вычитка; носитель не привлекался'
      constellations:
        [health, food, transport, home, shopping, people, time, city, work]
      # Проходы вычитки. `content_hash` — отпечаток яруса на
      # момент прохода: правка текста после вычитки делает её
      # устаревшей, и это видно машинно, а не на глаз.
      #
      # `scope` обязателен. Частичный проход записывается, потому
      # что говорит, что с ярусом делали, — но к требованию «две
      # модели прочитали ярус целиком» не идёт: покрытие не то же
      # самое, что прочтение в одном контексте.
      passes:
        - model: 'claude-opus-5 (перевод на украинский)'
          at: '2026-09-08'
          content_hash: '5fa35ffbecce'
          scope: phrases
          note: 'Читал каждую фразу яруса, чтобы перевести; дал 55 замечаний к немецкой стороне на все ярусы, из них применено 27'
        - model: 'claude-opus-5 (перекрёстная проверка перевода)'
          at: '2026-09-08'
          content_hash: '5fa35ffbecce'
          scope: phrases
          note: 'Второй моделью, против первой: нашёл 68 правок, включая немецкие слова, оставленные без перевода в украинской строке'
        - model: 'claude-opus-5 (проверка существования форм)'
          at: '2026-09-09'
          content_hash: '5fa35ffbecce'
          scope: forms
          note: 'Все 573 формы, не объяснимые словником и контентом: 570 признаны настоящими, 3 сомнительных отменены вторым проходом. Выдумок не найдено'
        # ── Раунды сплошной вычитки. Каждый читал ярус целиком двумя
        # ── независимыми взглядами: «немецкий как немецкий» и «контент как
        # ── упражнение». Каждый нашёл настоящее, и каждая правка меняла текст —
        # ── поэтому отпечатки у раундов разные, и это не путаница в записи, а
        # ── её смысл: пройденная вычитка описывает тот текст, который читали.
        - model: 'claude-opus-5 (сплошная вычитка A0, грамматический взгляд)'
          at: '2026-09-09'
          content_hash: '5fa35ffbecce'
          scope: full
          findings: 37
          note: '108 концептов и 36 фраз. Слова чистые; провалились фразы: в 24 из 36 пропуск имел больше одного правильного ответа («Ich habe Durst», «Gehen Sie nach links»)'
        - model: 'claude-sonnet-4-5 (сплошная вычитка A0, взгляд на упражнение)'
          at: '2026-09-09'
          content_hash: '5fa35ffbecce'
          scope: full
          findings: 13
          note: 'Тот же ярус против того же текста. Нашёл, что сборщик пула шире в аркадном заходе, и что регистр фразы уезжает игроку словом casual'
        - model: 'claude-opus-5 (второй раунд, грамматический взгляд)'
          at: '2026-09-09'
          content_hash: '48d74b29e0fe'
          scope: full
          findings: 12
          note: 'После правки вариантов. Подтвердил единственность ответа и нашёл зеркальную ошибку: раз все варианты отсеиваются грамматикой, ответ опознаётся по артиклю — 27 фраз из 36'
        - model: 'claude-sonnet-4-5 (второй раунд, взгляд на упражнение)'
          at: '2026-09-09'
          content_hash: '48d74b29e0fe'
          scope: full
          findings: 6
          note: 'Тот же вывод независимо, плюс: множественное число нигде не показывается, а созвучные дистракторы родного языка до игрока не доходят'
        - model: 'claude-opus-5 (третий раунд, грамматический взгляд)'
          at: '2026-09-09'
          content_hash: 'f29f7e4fc931'
          scope: full
          findings: 16
          note: 'После придаточных в 19 шаблонах. Нашёл 7 фраз, где вариант того же рода даёт правильный немецкий («Er ist im Bett und telefoniert»), и 8 безартиклевых рамок, куда правка не дошла'
        - model: 'claude-sonnet-4-5 (третий раунд, взгляд на упражнение)'
          at: '2026-09-09'
          content_hash: 'f29f7e4fc931'
          scope: full
          findings: 7
          note: 'Читал собранную базу, а не YAML, и нашёл главное за все раунды: phrase_options отдаётся по первичному ключу, то есть по алфавиту, и обрезка выкидывала строчные прилагательные'
        - model: 'claude-opus-5 (четвёртый раунд, грамматический взгляд)'
          at: '2026-09-09'
          content_hash: '3bf174b59661'
          scope: full
          findings: 14
          note: 'Ноль ошибок в 108 формах, родах, множественных числах и пометках. Нашёл, что черновое слово уезжает игроку через options, минуя ворота, и две фразы с правильным вторым ответом'
        - model: 'claude-sonnet-4-5 (четвёртый раунд, взгляд на упражнение)'
          at: '2026-09-09'
          content_hash: '3bf174b59661'
          scope: full
          findings: 13
          note: 'Сошёлся с грамматическим взглядом на «Das ist zu spät, ich kaufe es nicht» независимо. Нашёл, что точка после пропуска отлетает от слова в 24 шаблонах из 36'
        - model: 'claude-opus-5 (пятый раунд, грамматический взгляд)'
          at: '2026-09-09'
          content_hash: 'e72540e46dd9'
          scope: full
          findings: 11
          note: 'Все 36 пропусков имеют единственный ответ, все 108 слов чистые четвёртый раунд подряд. Нашёл: пять фраз, где «собери предложение» отвергает верный порядок слов, и переводы, использующие не то слово, которое учит ярус. Вердикт: годен для игроков, не годен для сторов'
        - model: 'claude-sonnet-4-5 (пятый раунд, взгляд на упражнение)'
          at: '2026-09-09'
          content_hash: 'e72540e46dd9'
          scope: full
          findings: 7
          note: 'Читал собранную базу. Нашёл третий случай той же ошибки «список без порядка плюс обрезка»: siblingForms не задаёт порядок, и на родном языке восемь концептов из двенадцати получали одну и ту же четвёрку неверных вариантов всегда. И единственную двухсловную форму на ярусе — круг решался выбором варианта с пробелом. Вердикт: не годен, пока это не исправлено'
        # Оба найденных кодовых дефекта исправлены (перемешивание соседей до
        # обрезки, «карта міста» → «мапа») — правки в коде и в родном языке,
        # немецкий текст яруса не тронут, поэтому отпечаток тот же.
        #
        # Что эти проходы нашли и что осталось: часть их замечаний снимается
        # переделкой фразовой механики (пропусков от двух до всех, вокруг
        # только вынутые слова, дистракторов нет вовсе) — списки неверных
        # вариантов у этой механики просто исчезают. А вот отвергнутый верный
        # порядок слов переделка не снимает, а ставит в центр: это её главный
        # риск, и он уже измерен — пять фраз из тридцати шести.
    a1:
      by: 'модельная вычитка; носитель не привлекался, озвучки нет'
