# Немецкий как язык изучения: заголовок языка.
#
# Этот файл — всё, что нужно, чтобы язык появился в приложении. Языки
# находятся перебором каталога content/lang/, а не списком в коде: добавить
# язык значит создать файл, а не править Dart.
#
# role: target — на этом языке учат. Какие его ярусы запущены, говорит
# content/launch.yaml; status здесь означает лишь то, что язык вообще можно
# предложить.
#
# Фразы лежат отдельно, в content/phrases/de/ — по файлу на созвездие. У
# языка изучения нет «перевода», у него есть текст, поэтому его строки не в
# языковом файле.
#
# Прежде здесь был каталог content/lang/de/ с лексемами по темам: 864 слова с
# родом, множественным числом и дистракторами. Единицей изучения стала фраза,
# и лексемы уехали в content/_material/lang_de/ — материалом, который
# пайплайн не читает.
#
# TODO(data): вычитка не проводилась. Разговорник импортирован целиком из
# content/_import/phrasebook_1000; правило «ярус не запускается без вычитки»
# на этом контенте ещё не исполнено, и валидатор об этом говорит.
lang: de
role: target
status: launched
name: Deutsch
