# Немецкие лексемы. Дистракторы: far — та же тема, другое значение;
# near — созвучные и однокоренные (docs/CONTENT_PIPELINE.md).
#
# TODO(data): вычитка носителем не проводилась. Формы взяты из Goethe A1
# Wortliste, частотность — из корпуса субтитров; перед запуском языка A0–A2
# вычитываются сплошь.
lang: de
