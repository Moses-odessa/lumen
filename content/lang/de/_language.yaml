# Немецкий как язык изучения: заголовок языка.
#
# Этот файл — всё, что нужно, чтобы язык появился в приложении. Языки
# находятся перебором каталога content/lang/, а не списком в коде: добавить
# язык значит создать один файл, а не править Dart.
#
# role: target — на этом языке учат. Какие его ярусы запущены, говорит
# content/launch.yaml; status здесь означает лишь то, что язык вообще можно
# предложить.
#
# Слова лежат рядом, по одному файлу на созвездие. Заголовок отделён от них
# намеренно: он относится к языку целиком, и держать его в файле одной темы
# значило бы, что удаление темы уносит язык.
#
# TODO(data): вычитка носителем не проводилась — вместо неё перекрёстная
# проверка независимыми моделями (PLAN.md, «Вычитка»). Формы для A0–A2 взяты
# из Goethe/OeSD Wortlisten, для B1-B2 — из терминологии Krankenkassen.
# Запущен только ярус A0, см. content/launch.yaml.
