# Русские лексемы — язык подсказок.
#
# Дистракторы здесь необязательны и заданы только для A0: в круге варианты
# всегда на изучаемом языке, кроме режима «Узнавание», а там нехватку
# закрывают соседи по созвездию. Тратить вычитку на дистракторы родного
# языка — значит тратить её не туда.
lang: ru
lexemes:
  # ── A0 ────────────────────────────────────────────────────────────────
  doctor_person:
    form: врач
    gender: m
    plural: врачи
    distractors:
      far: [зуб, уход]
      near: [грач, врал, врозь]
  pain_noun:
    form: боль
    gender: f
    distractors:
      far: [рана, кашель]
      near: [соль, моль, роль]
  help_noun:
    form: помощь
    gender: f
    distractors:
      far: [уход, вызов]
      near: [помощник, помочь, немощь]
  head_body:
    form: голова
    gender: f
    plural: головы
    distractors:
      far: [шея, спина]
      near: [половина, головка, голод]
  belly_body:
    form: живот
    gender: m
    plural: животы
    distractors:
      far: [грудь, нога]
      near: [животное, жизнь, живой]
  hand_body:
    form: рука
    gender: f
    plural: руки
    distractors:
      far: [нога, палец]
      near: [ручка, мука, река]
  fever_noun:
    form: жар
    gender: m
    distractors:
      far: [кашель, насморк]
      near: [жара, пар, шар]
  medicine_noun:
    form: лекарство
    gender: n
    plural: лекарства
    distractors:
      far: [рецепт, мазь]
      near: [лекарь, лекарственный, лакомство]
  pharmacy_place:
    form: аптека
    gender: f
    plural: аптеки
    distractors:
      far: [приём, клиника]
      near: [аптекарь, апатия, аптечка]
  hospital_place:
    form: больница
    gender: f
    plural: больницы
    distractors:
      far: [приём, скорая]
      near: [больной, больничный, лечебница]
  sick_adj:
    form: больной
    note: прилагательное
    distractors:
      far: [усталый, здоровый]
      near: [больно, больница, вольный]
  appointment_noun:
    form: приём
    gender: m
    plural: приёмы
    distractors:
      far: [рецепт, запись]
      near: [приёмная, приятный, подъём]

  # ── A1 ────────────────────────────────────────────────────────────────
  tooth_body: { form: зуб, gender: m, plural: зубы }
  back_body: { form: спина, gender: f, plural: спины }
  leg_body: { form: нога, gender: f, plural: ноги }
  throat_body: { form: горло, gender: n, plural: горла }
  cough_noun: { form: кашель, gender: m }
  cold_illness: { form: простуда, gender: f, plural: простуды }
  prescription_noun: { form: рецепт, gender: m, plural: рецепты }
  nurse_person: { form: медсестра, gender: f, plural: медсёстры }
  waiting_room: { form: приёмная, gender: f }
  insurance_card: { form: страховая карта, gender: f }
  healthy_adj: { form: здоровый, note: прилагательное }
  temperature_noun: { form: температура, gender: f }

  # ── A2 ────────────────────────────────────────────────────────────────
  sick_note: { form: больничный лист, gender: m }
  dosage_noun: { form: доза, gender: f, plural: дозы }
  side_effect: { form: побочный эффект, gender: m }
  allergy_noun: { form: аллергия, gender: f }
