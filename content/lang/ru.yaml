  clarify_mediate_b1_21: "В переводе потерялась важная деталь."
  clarify_mediate_b1_22: "Попробую передать смысл без специальных терминов."
  clarify_mediate_b1_23: "Можно разделить этот вопрос на две части?"
  clarify_mediate_b1_24: "Объясните, пожалуйста, на конкретной ситуации."
  clarify_mediate_b1_25: "Я уточню у неё, согласна ли она."
  clarify_mediate_b1_26: "Не хочу говорить от его имени."
