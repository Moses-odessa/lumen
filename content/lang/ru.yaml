      near: [животное, жизнь, живой]
  hand_body:
    form: рука
    gender: f
    plural: руки
    distractors:
      far: [нога, палец]
      near: [ручка, мука, река]
  fever_noun:
    form: жар
    gender: m
    distractors:
      far: [кашель, насморк]
      near: [жара, пар, шар]
  medicine_noun:
    form: лекарство
    gender: n
    plural: лекарства
    distractors:
      far: [рецепт, мазь]
      near: [лекарь, лекарственный, лакомство]
  pharmacy_place:
    form: аптека
    gender: f
    plural: аптеки
    distractors:
      far: [приём, клиника]
      near: [аптекарь, апатия, аптечка]
  hospital_place:
    form: больница
    gender: f
    plural: больницы
    distractors:
      far: [приём, скорая]
      near: [больной, больничный, лечебница]
  sick_adj:
    form: больной
    note: прилагательное
    distractors:
      far: [усталый, здоровый]
      near: [больно, больница, вольный]
