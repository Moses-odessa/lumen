  ecology_decisions_b2_01: "Экологические меры должны быть справедливыми и финансово доступными."
  ecology_decisions_b2_02: "Нужно учитывать полный жизненный цикл продукта."
  ecology_decisions_b2_03: "Низкая цена не всегда отражает реальную стоимость."
  ecology_decisions_b2_04: "Кто будет нести расходы перехода?"
  ecology_decisions_b2_05: "Личный выбор важен, но не заменяет системных изменений."
  ecology_decisions_b2_06: "Долгосрочная выгода может превысить первоначальные расходы."
  ecology_decisions_b2_07: "Нам нужны измеримые цели."
  ecology_decisions_b2_08: "Как мы проверим, работает ли эта мера?"
  ecology_decisions_b2_09: "Не следует просто переносить проблему в другое место."
  ecology_decisions_b2_10: "Обещанный эффект зависит от условий использования."
  ecology_decisions_b2_11: "Нужно отличать реальные изменения от рекламы."
  ecology_decisions_b2_12: "Возможные последствия бездействия тоже имеют цену."
  ecology_decisions_b2_13: "Нужно учитывать влияние производства, а не только использования."
  ecology_decisions_b2_14: "Как долго изделие должно служить, чтобы замена была оправданной?"
  ecology_decisions_b2_15: "Эта оценка не учитывает транспортировку."
  ecology_decisions_b2_16: "Местное производство само по себе не гарантирует меньшего воздействия."
  ecology_decisions_b2_17: "Следует проверить, что именно означает этот экологический знак."
  ecology_decisions_b2_18: "Экономия может исчезнуть, если потребление вырастет."
  ecology_decisions_b2_19: "Кто будет контролировать выполнение экологических обязательств?"
  ecology_decisions_b2_20: "План должен содержать промежуточные цели, которые можно проверить."
  ecology_decisions_b2_21: "Изменения не должны перекладывать всю нагрузку на потребителей."
  ecology_decisions_b2_22: "Сравнение должно учитывать одинаковый срок использования."
  ecology_decisions_b2_23: "Сравнивая ремонт и замену, нужно учитывать расход ресурсов."
  ecology_decisions_b2_24: "Экологическая польза исчезает, если новая система расходует больше ресурсов, чем экономит."
  ecology_decisions_b2_25: "Переход на электробусы потребует новой зарядной инфраструктуры."
  ecology_decisions_b2_26: "Чтобы не усиливать неравенство, следует поддержать семьи с низкими доходами."
  ecology_decisions_b2_27: "В зависимости от местных условий результат может существенно различаться."
  ecology_decisions_b2_28: "Расходы на утепление следует сравнить с ожидаемой экономией энергии."
  ecology_decisions_b2_29: "Без изменений в транспортной системе нам вряд ли удастся существенно сократить пробки."
  ecology_decisions_b2_30: "Эта мера будет иметь смысл лишь тогда, когда жители смогут воспользоваться предложенной альтернативой."
