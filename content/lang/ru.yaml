  reimbursement_noun: { form: возмещение, gender: n }
  supplementary_insurance: { form: дополнительная страховка, gender: f }
  contribution_noun: { form: взнос, gender: m, plural: взносы }
  certificate_noun: { form: справка, gender: f, plural: справки }
  incapacity_noun: { form: нетрудоспособность, gender: f }
  expert_opinion: { form: экспертное заключение, gender: n }
  consent_noun: { form: согласие, gender: n }
  liability_noun: { form: ответственность, gender: f }
  malpractice_noun: { form: врачебная ошибка, gender: f }
  prognosis_noun: { form: прогноз, gender: m, plural: прогнозы }
  contraindication_noun: { form: противопоказание, gender: n }
  interaction_noun: { form: взаимодействие, gender: n }
  dosage_form: { form: форма выпуска, gender: f }
  prescription_only: { form: рецептурный, note: прилагательное }
  outpatient_adj: { form: амбулаторный, note: прилагательное }
