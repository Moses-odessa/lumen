# Русские лексемы — язык подсказок.
#
# Дистракторы здесь необязательны и заданы только для A0: варианты на родном
# языке берутся из соседей по созвездию, то есть из слов, которые уже
# написаны и проверены. Придумать несуществующее слово при этом структурно
# невозможно, а заданные руками имеют приоритет над соседями.
#
# status: draft — язык полон на сегодняшние 864 концепта, но вперёд, на 6299,
# он не пойдёт: проект несёт немецкий и украинский (PLAN.md). Файл остаётся в
# репозитории целиком: удалять готовую работу незачем, а draft снимает с него
# требование полноты и не даёт ему молча разойтись с контентом. Чтобы вернуть
# русский в игру, достаточно поменять здесь одно слово на launched.
