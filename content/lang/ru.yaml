  tablet_noun: { form: таблетка, gender: f, plural: таблетки }
  injection_noun: { form: укол, gender: m, plural: уколы }
  vaccination_noun: { form: прививка, gender: f, plural: прививки }
  emergency_noun: { form: экстренный случай, gender: m }
  ambulance_noun: { form: скорая помощь, gender: f }
  surgery_place: { form: врачебная практика, gender: f }
  dentist_person: { form: стоматолог, gender: m, plural: стоматологи }
  examination_noun: { form: обследование, gender: n }
  treatment_noun: { form: лечение, gender: n }
  painkiller_noun: { form: обезболивающее, gender: n }
  flu_illness: { form: грипп, gender: m }
  wound_noun: { form: рана, gender: f, plural: раны }
  dizzy_adj: { form: головокружение, note: «мне дурно» }
  breath_noun: { form: дыхание, gender: n }
  heart_body: { form: сердце, gender: n, plural: сердца }
  stomach_organ: { form: желудок, gender: m, plural: желудки }
  skin_body: { form: кожа, gender: f }

  # ── B1 ────────────────────────────────────────────────────────────────
  cost_coverage: { form: покрытие расходов, gender: n }
  referral_noun: { form: направление, gender: n }
  lab_result: { form: результат анализов, gender: m }
  diagnosis_noun: { form: диагноз, gender: m, plural: диагнозы }
  therapy_noun: { form: терапия, gender: f }
  specialist_person: { form: профильный врач, gender: m }
  health_insurance: { form: больничная касса, gender: f }
  medical_report: { form: заключение врача, gender: n }
  chronic_adj: { form: хронический, note: прилагательное }
  inflammation_noun: { form: воспаление, gender: n }
  infection_noun: { form: инфекция, gender: f }
  antibiotic_noun: { form: антибиотик, gender: m, plural: антибиотики }
  blood_pressure: { form: давление, gender: n }
  blood_draw: { form: забор крови, gender: m }
  ultrasound_noun: { form: УЗИ, gender: n }
  xray_noun: { form: рентгеновский снимок, gender: m }
  operation_noun: { form: операция, gender: f, plural: операции }
  anesthesia_noun: { form: наркоз, gender: m }
  rehab_noun: { form: реабилитация, gender: f }
  physiotherapy_noun: { form: физиотерапия, gender: f }
  symptom_noun: { form: симптом, gender: m, plural: симптомы }
  complaints_noun: { form: жалобы, gender: f, note: множественное число }
  medical_history: { form: анамнез, gender: m }
