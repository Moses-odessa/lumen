  society_rights_b2_16: "Чи є незалежний орган, який розглядає такі скарги?"
  society_rights_b2_17: "Обговорення слід провести до ухвалення рішення."
  society_rights_b2_18: "Представництво групи не означає, що всі її члени думають однаково."
  society_rights_b2_19: "Чи передбачено підтримку для тих, кому важко заповнити заяву?"
  society_rights_b2_20: "Прозорі критерії допоможуть уникнути довільних рішень."
  society_rights_b2_21: "Правила потрібно викласти зрозумілою мовою."
  society_rights_b2_22: "Можливість користуватися послугою не повинна залежати від місця проживання."
  society_rights_b2_23: "З погляду рівності можливостей, важливо зберегти безкоштовний доступ до курсу."
  society_rights_b2_24: "Це рішення особливо вплине на людей, які живуть далеко від центру."
  society_rights_b2_25: "Потрібно забезпечити, щоб інформація була доступною і людям без інтернету."
  society_rights_b2_26: "Питання в тому, хто має право ухвалювати рішення від імені мешканців."
  society_rights_b2_27: "Свобода висловлювати думку має поєднуватися з повагою до інших."
  society_rights_b2_28: "Я підтримую мету зменшити шум, але сумніваюся в доцільності повної заборони."
  society_rights_b2_29: "Щоб участь мала сенс, потрібна можливість реально впливати на рішення."
  society_rights_b2_30: "Було б несправедливо виключати людей з обговорення, якщо рішення безпосередньо їх стосується."
  sources_evidence_b2_01: "На чому ґрунтується це твердження?"
  sources_evidence_b2_02: "Чи є дані, які це підтверджують?"
  sources_evidence_b2_03: "Я хотів би перевірити першоджерело."
  sources_evidence_b2_04: "Коли опублікували цю інформацію?"
  sources_evidence_b2_05: "Хто відповідає за зміст?"
