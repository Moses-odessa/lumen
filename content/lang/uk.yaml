  sources_evidence_b2_08: "У статті не вказано джерело цифр."
  sources_evidence_b2_09: "Приклад сам по собі ще нічого не доводить."
  sources_evidence_b2_10: "Кореляція не обов'язково означає причинний зв'язок."
  sources_evidence_b2_11: "Потрібно порівняти кілька незалежних джерел."
  sources_evidence_b2_12: "Ці результати не можна автоматично узагальнювати."
  sources_evidence_b2_13: "Чи була вибірка репрезентативною?"
  sources_evidence_b2_14: "Хто фінансував це дослідження?"
  sources_evidence_b2_15: "Чи вдалося іншим дослідникам відтворити результати?"
  sources_evidence_b2_16: "Чи розрізняє звіт оцінки та вимірювання?"
  sources_evidence_b2_17: "Відсутні дані можуть спотворити картину."
  sources_evidence_b2_18: "Як відбирали учасників?"
  sources_evidence_b2_19: "Джерело було оновлено після публікації."
  sources_evidence_b2_20: "Чи може заголовок вводити в оману, хоча сама стаття точна?"
  sources_evidence_b2_21: "Я не можу знайти цю цитату в першоджерелі."
  sources_evidence_b2_22: "Відокреммо перевірені факти від непідтверджених повідомлень."
  sources_evidence_b2_23: "За даними нашого опитування, половина учасників віддає перевагу вечірнім заняттям."
  sources_evidence_b2_24: "Автор стверджує, що метод ефективний, але не наводить результатів досліджень."
  sources_evidence_b2_25: "Наявні дані вказують на поступове зростання попиту."
  sources_evidence_b2_26: "Наскільки надійне опитування з такою малою кількістю учасників?"
  sources_evidence_b2_27: "Незрозуміло, чи враховувався вік учасників."
  sources_evidence_b2_28: "Без інформації про метод дослідження важко оцінити достовірність висновків."
  sources_evidence_b2_29: "Це підтверджує наше припущення, але не доводить причинного зв'язку."
  sources_evidence_b2_30: "Я б перевірив, чи це справді так: опитування проводили в усіх регіонах."
  study_contact_a1_01: "Коли починається заняття?"
