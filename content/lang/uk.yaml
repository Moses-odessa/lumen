  negotiation_b2_17: "Ми можемо погодитися на часткову доставку."
  negotiation_b2_18: "Що відбудеться, якщо обставини зміняться?"
  negotiation_b2_19: "Додаймо пункт про перегляд умов через пів року."
  negotiation_b2_20: "Перш ніж брати зобов'язання, я маю порадитися з командою."
  negotiation_b2_21: "Цей виняток не має стати прецедентом."
  negotiation_b2_22: "Які умови не підлягають обговоренню?"
  negotiation_b2_23: "Ми готові продовжити термін за умови, що ціна залишиться незмінною."
  negotiation_b2_24: "Якщо Ви підете нам назустріч щодо ціни, ми збільшимо замовлення."
