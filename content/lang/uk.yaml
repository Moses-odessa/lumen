  negotiation_b2_01: "Давайте з'ясуємо, що важливо для кожної сторони."
  negotiation_b2_02: "Наші цілі ближчі, ніж здається."
  negotiation_b2_03: "Я готовий до компромісу щодо строків."
  negotiation_b2_04: "Але якістю ми поступитися не можемо."
  negotiation_b2_05: "Що ви могли б запропонувати натомість?"
  negotiation_b2_06: "За цих умов пропозиція для нас неприйнятна."
  negotiation_b2_07: "Я розумію ваші обмеження."
