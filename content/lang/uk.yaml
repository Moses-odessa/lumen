# Українські лексеми — мова підказок.
#
# Напрямок «українська → німецька» у великих застосунків просто відсутній,
# тому вона в проєкті з першого дня. Дистрактори задані лише для A0 — див.
# пояснення у ru.yaml.
#
# Заголовок нижче — це все, що потрібно, щоб мова з'явилася у застосунку.
# Мови знаходяться переглядом каталогу content/lang/, а не списком у коді:
# додати мову означає створити один файл, а не правити Dart.
