  housing_repairs_a2_30: "Цей замок можна полагодити?"
  idioms_speech_b2_01: "У мене зараз багато справ."
  idioms_speech_b2_02: "Мені потрібно все це поєднати."
  idioms_speech_b2_03: "Я збився з думки."
  idioms_speech_b2_04: "Це влучно сказано."
  idioms_speech_b2_05: "Давай не ходити навколо."
  idioms_speech_b2_06: "Це зовсім інша справа."
  idioms_speech_b2_07: "Не варто перебільшувати проблему."
  idioms_speech_b2_08: "Я тримаю за тебе кулаки."
  idioms_speech_b2_09: "Це лише вершина айсберга."
  idioms_speech_b2_10: "У цьому й проблема."
  idioms_speech_b2_11: "Мені треба обдумати це до завтра."
  idioms_speech_b2_12: "Я не хочу робити поспішних кроків."
  idioms_speech_b2_13: "Здається, ми говоримо повз одне одного."
  idioms_speech_b2_14: "Тепер усе починає складатися."
  idioms_speech_b2_15: "Наші плани зірвалися."
  idioms_speech_b2_16: "Це мені не дає спокою."
  idioms_speech_b2_17: "Я не можу просто заплющити на це очі."
  idioms_speech_b2_18: "Ми нарешті зрушили з місця."
  idioms_speech_b2_19: "Це було останньою краплею."
  idioms_speech_b2_20: "Усе поступово налагодиться."
  idioms_speech_b2_21: "Ми в одному човні."
  idioms_speech_b2_22: "Це того не варте."
  idioms_speech_b2_23: "Мене це вже дістало."
  idioms_speech_b2_24: "Ловлю тебе на слові."
  idioms_speech_b2_25: "Це мені щось нагадує."
  idioms_speech_b2_26: "Що зроблено, того не повернеш."
  idioms_speech_b2_27: "Усе по черзі."
  idioms_speech_b2_28: "Ми ходимо по колу."
