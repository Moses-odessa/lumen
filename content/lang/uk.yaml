  health_lifestyle_b1_01: "Останнім часом я погано сплю."
  health_lifestyle_b1_02: "Мені важко поєднувати роботу й відпочинок."
  health_lifestyle_b1_03: "Я хочу поступово змінити свої звички."
  health_lifestyle_b1_04: "Мені допомагають регулярні прогулянки."
  health_lifestyle_b1_05: "Я намагаюся робити перерви."
  health_lifestyle_b1_06: "Після роботи мені важко розслабитися."
  health_lifestyle_b1_07: "Це впливає на моє самопочуття."
  health_lifestyle_b1_08: "Я хотів би обговорити це з фахівцем."
  health_lifestyle_b1_09: "Які є можливості лікування?"
  health_lifestyle_b1_10: "Які переваги й ризики цього лікування?"
  health_lifestyle_b1_11: "Чи існує інший варіант?"
  health_lifestyle_b1_12: "Я хотів би отримати другу думку."
  health_lifestyle_b1_13: "Чи правильно я зрозумів рекомендацію?"
  health_lifestyle_b1_14: "Я не хочу самостійно змінювати дозу."
  health_lifestyle_b1_15: "Я хочу бути активнішим без перевантаження."
  health_lifestyle_b1_16: "Мені потрібен план, якого я зможу дотримуватися."
  health_lifestyle_b1_17: "Я записую, скільки годин сплю."
  health_lifestyle_b1_18: "Я став пити менше кави ввечері."
  health_lifestyle_b1_19: "Це заважає мені працювати."
  health_lifestyle_b1_20: "Я хотів би поговорити про своє психічне здоров'я."
