  meetings_decisions_b2_01: "Пропоную почати з головного питання."
  meetings_decisions_b2_02: "Яка мета сьогоднішньої зустрічі?"
  meetings_decisions_b2_03: "Нам потрібно прийняти рішення, а не лише обмінятися думками."
  meetings_decisions_b2_04: "Хто ще хотів би висловитися?"
  meetings_decisions_b2_05: "Давайте повернемося до порядку денного."
  meetings_decisions_b2_06: "Це важливо, але потребує окремого обговорення."
  meetings_decisions_b2_07: "Ми трохи відхилилися від теми."
  meetings_decisions_b2_08: "Які ризики ми ще не обговорили?"
  meetings_decisions_b2_09: "Чи є заперечення проти цього рішення?"
  meetings_decisions_b2_10: "Мовчання не обов'язково означає згоду."
  meetings_decisions_b2_11: "Хто матиме право остаточного рішення?"
  meetings_decisions_b2_12: "Потрібно визначити відповідального і строк."
  meetings_decisions_b2_13: "Дамо слово тим, хто ще не висловлювався."
  meetings_decisions_b2_14: "Я внесу це до протоколу як відкрите питання."
  meetings_decisions_b2_15: "Відокреммо саме рішення від дій, потрібних для його виконання."
  meetings_decisions_b2_16: "Час спливає, тому пропоную перейти до наступного пункту."
  meetings_decisions_b2_17: "Відкладімо це обговорення до отримання даних."
  meetings_decisions_b2_18: "Ми маємо повноваження ухвалити це рішення сьогодні?"
  meetings_decisions_b2_19: "Хто замінить відповідального під час його відсутності?"
  meetings_decisions_b2_20: "Я утримаюся, оскільки не брав участі в попередньому обговоренні."
  meetings_decisions_b2_21: "Це рішення потребує погодження фінансового відділу."
  meetings_decisions_b2_22: "Що саме потрібно від мене, щоб робота могла продовжитися?"
  meetings_decisions_b2_23: "До наступної зустрічі ми маємо зібрати відгуки клієнтів."
  meetings_decisions_b2_24: "Питання додаткового фінансування залишається відкритим."
  meetings_decisions_b2_25: "Ми дійшли згоди щодо розподілу обов'язків."
  meetings_decisions_b2_26: "Я зафіксую в протоколі, що Анна підготує звіт до середи."
  meetings_decisions_b2_27: "Перший крок — узгодити критерії оцінювання."
  meetings_decisions_b2_28: "Оцінимо результат після місяця роботи."
  meetings_decisions_b2_29: "Чи правильно я підсумував: ми починаємо пробний етап у понеділок?"
  meetings_decisions_b2_30: "На завершення хочу нагадати всім про термін подання пропозицій."
  money_contracts_b1_01: "Я хочу краще планувати свій бюджет."
