  travel_trouble_a2_03: "Яка наступна можливість виїхати?"
  travel_trouble_a2_04: "Цей квиток ще дійсний?"
  travel_trouble_a2_05: "Мені потрібен інший маршрут."
  travel_trouble_a2_06: "Де зупиняється автобус замість поїзда?"
  travel_trouble_a2_07: "Я загубив свій гаманець."
  travel_trouble_a2_08: "Я залишив сумку в автобусі."
  travel_trouble_a2_09: "Де бюро знахідок?"
  travel_trouble_a2_10: "Мій багаж не прибув."
  travel_trouble_a2_11: "Ось опис моєї валізи."
  travel_trouble_a2_12: "Мені потрібне підтвердження затримки."
  travel_trouble_a2_13: "Де можна подати заяву?"
  travel_trouble_a2_14: "Можна змінити дату поїздки?"
  travel_trouble_a2_15: "Я не встигаю на пересадку."
  travel_trouble_a2_16: "Хто може мені допомогти?"
  travel_trouble_a2_17: "Мені потрібно заблокувати картку."
  travel_trouble_a2_18: "Можна скористатися Вашим телефоном?"
  travel_trouble_a2_19: "Мені потрібно зв'язатися з посольством."
  travel_trouble_a2_20: "Я повідомив поліцію про втрату."
  travel_trouble_a2_21: "Про скасування не попереджали."
  travel_trouble_a2_22: "Я прибуду до готелю після півночі."
  travel_trouble_a2_23: "Мій багаж перевантажать автоматично?"
  travel_trouble_a2_24: "У мене немає доступу до електронного квитка."
  travel_trouble_a2_25: "Можете роздрукувати посадковий талон?"
  travel_trouble_a2_26: "Чи потрібно доплачувати за зміну маршруту?"
  travel_trouble_a2_27: "Я загубив паспорт біля вокзалу."
  travel_trouble_a2_28: "Затримка становить сорок хвилин."
  travel_trouble_a2_29: "Є інший спосіб дістатися до готелю?"
  travel_trouble_a2_30: "До кого можна звернутися щодо загубленого багажу?"
  understanding_a0_01: "Я не розумію."
  understanding_a0_02: "Тепер я розумію."
  understanding_a0_03: "Повільніше, будь ласка."
  understanding_a0_04: "Ще раз, будь ласка."
  understanding_a0_05: "Повторіть, будь ласка."
  understanding_a0_06: "Що це означає?"
  understanding_a0_07: "Як це сказати німецькою?"
  understanding_a0_08: "Як це пишеться?"
  understanding_a0_09: "Напишіть це, будь ласка."
  understanding_a0_10: "Покажіть, будь ласка."
  understanding_a0_11: "Я не знаю."
  understanding_a0_12: "Я не впевнений."
  understanding_a0_13: "Так, саме так."
  understanding_a0_14: "Ні, не це."
  understanding_a0_15: "Це правильно?"
  understanding_a0_16: "Одну хвилинку, будь ласка."
  understanding_a0_17: "Я не чую."
  understanding_a0_18: "Голосніше, будь ласка."
  understanding_a0_19: "Можна англійською?"
  understanding_a0_20: "Як вимовляється слово «готель»?"
  understanding_a0_21: "Якою мовою?"
  understanding_a0_22: "Я трохи розумію."
  understanding_a0_23: "Як це називається?"
  understanding_a0_24: "Я не розмовляю італійською."
  understanding_a0_25: "Так?"
  understanding_a0_26: "Це те саме?"
  understanding_a0_27: "Будь ласка, використовуйте прості слова."
  understanding_a0_28: "Будь ласка, покажіть пальцем."
  understanding_a0_29: "Я не розчув останнього слова."
  understanding_a0_30: "Можна скористатися застосунком-перекладачем?"
  work_change_b2_01: "Професійний досвід не завжди замінює систематичне навчання."
  work_change_b2_02: "Мені важливо розуміти, навіщо потрібна ця зміна."
  work_change_b2_03: "Нові обов'язки мають супроводжуватися підтримкою."
  work_change_b2_04: "Гнучкий графік не означає постійну доступність."
  work_change_b2_05: "Продуктивність не варто вимірювати лише кількістю годин."
  work_change_b2_06: "Яка компетенція буде потрібна нам надалі?"
  work_change_b2_07: "Навчання має бути пов'язане з реальними завданнями."
  work_change_b2_08: "Помилки можуть бути джерелом навчання, якщо їх аналізувати."
  work_change_b2_09: "Я ціную конкретний зворотний зв'язок більше за загальну похвалу."
  work_change_b2_10: "Перехід має бути поступовим і передбачуваним."
  work_change_b2_11: "Нам потрібно зберегти те, що вже працює."
  work_change_b2_12: "Не кожна нова технологія розв'язує реальну проблему."
  work_change_b2_13: "Я хотів би розуміти, як оцінюватимуть мій прогрес."
  work_change_b2_14: "Чи буде час на навчання включено до робочого графіка?"
  work_change_b2_15: "Новий процес спочатку варто перевірити на невеликій групі."
  work_change_b2_16: "Потрібно пояснити, які обов'язки зміняться, а які залишаться."
  work_change_b2_17: "Опір змінам може свідчити про брак ясності, а не мотивації."
  work_change_b2_18: "Я хотів би отримати приклад того, що можна покращити."
  work_change_b2_19: "Одна помилка не повинна визначати загальну оцінку роботи."
  work_change_b2_20: "Знання залишаються в команді, коли процеси задокументовані."
  work_change_b2_21: "Чи можна поєднати наставництво із самостійною практикою?"
  work_change_b2_22: "Перші результати слід обговорити до повного впровадження."
  work_change_b2_23: "Щоб адаптуватися до нового програмного забезпечення, нам потрібно пройти коротке навчання."
  work_change_b2_24: "Я хотів би розвинути навички переговорів, щоб упевненіше обговорювати умови."
  work_change_b2_25: "Складність полягає в тому, щоб поєднати поточні завдання з часом на навчання."
  work_change_b2_26: "Замість того щоб оцінювати лише швидкість, слід враховувати і якість результату."
  work_change_b2_27: "Успіх переходу залежатиме від того, наскільки зрозуміло ми пояснимо нові процеси."
  work_change_b2_28: "Мій попередній досвід показав, що невеликі регулярні зміни працюють краще за різкі."
  work_change_b2_29: "Для стійкого результату важливо регулярно застосовувати нові навички."
  work_change_b2_30: "Перш ніж запроваджувати нову систему, слід перевірити, чи готова команда нею користуватися."
  work_search_a2_01: "Я шукаю роботу."
  work_search_a2_02: "Мене цікавить ця вакансія."
  work_search_a2_03: "Де можна надіслати резюме?"
  work_search_a2_04: "У мене є досвід у продажах."
  work_search_a2_05: "Я працював у невеликій компанії."
  work_search_a2_06: "Я швидко вчуся."
  work_search_a2_07: "Я люблю працювати в команді."
  work_search_a2_08: "Я можу почати наступного місяця."
  work_search_a2_09: "Це повний чи неповний робочий день?"
  work_search_a2_10: "Який робочий графік?"
  work_search_a2_11: "Які мої основні завдання?"
  work_search_a2_12: "Хто буде моїм керівником?"
  work_search_a2_13: "Чи передбачене навчання?"
  work_search_a2_14: "Коли відбудеться співбесіда?"
  work_search_a2_15: "Я надіслав усі документи."
  work_search_a2_16: "Коли можна очікувати відповідь?"
  work_search_a2_17: "Випробувальний період оплачується?"
  work_search_a2_18: "Чи можна іноді працювати дистанційно?"
  work_search_a2_19: "Я можу пройти співбесіду наступного тижня."
  work_search_a2_20: "Можете описати типовий робочий день?"
  work_search_a2_21: "У мене ще немає цього сертифіката."
  work_search_a2_22: "Зараз я проходжу професійний курс."
  work_search_a2_23: "Вам потрібні рекомендації від попереднього роботодавця?"
  work_search_a2_24: "Можна отримати відгук щодо моєї заявки?"
  work_search_a2_25: "Повідомте, будь ласка, якщо вакансію вже закрито."
  work_search_a2_26: "Я хотів би прочитати пропозицію перед рішенням."
  work_search_a2_27: "У мене є досвід роботи з клієнтами."
  work_search_a2_28: "До моїх обов'язків входило приймання замовлень."
  work_search_a2_29: "Я хотів би працювати неповний день."
  work_search_a2_30: "Для цієї роботи потрібне водійське посвідчення?"
