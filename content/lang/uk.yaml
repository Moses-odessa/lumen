  hedging_b2_01: "Наскільки я можу судити, це реалістично."
  hedging_b2_02: "Я не виключаю такої можливості."
  hedging_b2_03: "Цілковитої впевненості в нас немає."
  hedging_b2_04: "На цьому етапі зарано робити висновки."
  hedging_b2_05: "Це радше припущення, ніж факт."
  hedging_b2_06: "Наявної інформації недостатньо для певного висновку."
  hedging_b2_07: "Тут я можу помилятися."
  hedging_b2_08: "Я готовий переглянути свою думку."
  hedging_b2_09: "Це залежить від того, як визначити успіх."
  hedging_b2_10: "Винятки можливі, але правило залишається корисним."
  hedging_b2_11: "Можливо, тут діють кілька чинників."
  hedging_b2_12: "Я сформулював би це обережніше."
  hedging_b2_13: "Я поки що не можу судити про це."
  hedging_b2_14: "Це так само можна пояснити сезонними змінами."
  hedging_b2_15: "Те, що ми цього не спостерігали, не означає, що цього немає."
  hedging_b2_16: "Я не можу точно сказати, скільки це триватиме."
  hedging_b2_17: "Я б поки що залишив це питання відкритим."
  hedging_b2_18: "Це звучить правдоподібно, але ще не перевірено."
  hedging_b2_19: "Оцінка залежить від того, які припущення ми оберемо."
  hedging_b2_20: "Я говорю лише про випадки, які знаю особисто."
  hedging_b2_21: "Було б передчасно називати це тенденцією."
  hedging_b2_22: "Попередньо я підтримую пропозицію, але чекаю уточнень."
  hedging_b2_23: "Наскільки мені відомо, остаточного рішення ще немає."
  hedging_b2_24: "Є підстави вважати, що новий розклад буде зручнішим."
  hedging_b2_25: "Не можна виключати, що витрати зростуть."
  hedging_b2_26: "За умови, що фінансування буде підтверджено, ми зможемо почати в жовтні."
  hedging_b2_27: "Це стосується переважно нових користувачів, а не досвідчених."
  hedging_b2_28: "За нинішніх обставин я схиляюся до короткого випробувального періоду."
  hedging_b2_29: "Якщо не з'являться нові дані, ми дотримуватимемося поточного плану."
  hedging_b2_30: "Я б не стверджував, що проблема вирішена, проте прогрес уже помітний."
  history_consequences_b1_01: "Усе почалося з непорозуміння."
  history_consequences_b1_02: "Спочатку я не надав цьому значення."
  history_consequences_b1_03: "Пізніше з'ясувалося, що інформація була неправильною."
  history_consequences_b1_04: "Тим часом ми вже почали роботу."
  history_consequences_b1_05: "Через це виникла затримка."
  history_consequences_b1_06: "Ми вирішили змінити план."
  history_consequences_b1_07: "Я не знав, як на це реагувати."
  history_consequences_b1_08: "Мені знадобився час, щоб це зрозуміти."
  history_consequences_b1_09: "Зрештою ми знайшли рішення."
  history_consequences_b1_10: "Цей досвід багато чого мене навчив."
  history_consequences_b1_11: "Тепер я вчинив би інакше."
  history_consequences_b1_12: "Найважче було почати спочатку."
  history_consequences_b1_13: "Ми не могли вплинути на ситуацію."
  history_consequences_b1_14: "Незважаючи на труднощі, ми продовжили."
  history_consequences_b1_15: "Це стало для мене поворотним моментом."
  history_consequences_b1_16: "Після цього багато що змінилося."
  history_consequences_b1_17: "Повернімося на кілька днів назад."
  history_consequences_b1_18: "На той момент ми вже витратили весь бюджет."
  history_consequences_b1_19: "Ніхто не помітив помилки одразу."
  history_consequences_b1_20: "Лише наступного дня я зрозумів, що сталося."
  history_consequences_b1_21: "На щастя, у мене збереглася копія."
  history_consequences_b1_22: "Це дозволило нам почати знову."
  history_consequences_b1_23: "Як наслідок, нам довелося змінити терміни."
  history_consequences_b1_24: "Озираючись назад, я розумію, чому це не спрацювало."
  history_consequences_b1_25: "Відтоді я завжди перевіряю адресу двічі."
  history_consequences_b1_26: "Найбільше мене здивувала реакція команди."
  history_consequences_b1_27: "Щойно ми прибули, стало зрозуміло, що адреса неправильна."
  history_consequences_b1_28: "Поки я готував презентацію, колега перевіряв цифри."
  history_consequences_b1_29: "Ми запізнилися через те, що дорогу перекрили."
  history_consequences_b1_30: "Якби я тоді знав про затримку, я б виїхав раніше."
  housing_repairs_a2_01: "Я шукаю квартиру на тривалий термін."
