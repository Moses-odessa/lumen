  persuasion_b2_01: "Хотів би звернути вашу увагу на повторну помилку."
  persuasion_b2_02: "Попри попереднє звернення, проблему не усунуто."
  persuasion_b2_03: "Такий результат не відповідає погодженим умовам."
  persuasion_b2_04: "Я очікую конкретної пропозиції щодо виправлення."
  persuasion_b2_05: "Будь ласка, повідомте, які кроки буде вжито."
  persuasion_b2_06: "Я зацікавлений у мирному вирішенні питання."
  persuasion_b2_07: "Мета мого звернення — запобігти повторенню ситуації."
  persuasion_b2_08: "Я готовий обговорити альтернативне рішення."
  persuasion_b2_09: "Прошу надати обґрунтування цієї відмови."
  persuasion_b2_10: "Чи можна переглянути рішення з урахуванням нових даних?"
  persuasion_b2_11: "Зі свого боку я виконав усі погоджені умови."
  persuasion_b2_12: "Буду вдячний за змістовну, а не формальну відповідь."
  persuasion_b2_13: "Я не заперечую саму процедуру, але прошу пояснити її застосування."
  persuasion_b2_14: "У відповіді не розглянуто головний пункт мого звернення."
  persuasion_b2_15: "Прошу вказати конкретні підстави для цього висновку."
  persuasion_b2_16: "Вважаю важливим зафіксувати послідовність подій."
  persuasion_b2_17: "Готовий надати підтвердження на Ваш запит."
  persuasion_b2_18: "Які додаткові відомості потрібні для повторного розгляду?"
  persuasion_b2_19: "Чи можете Ви підтвердити, хто відповідає за розгляд справи?"
  persuasion_b2_20: "Прошу повідомити очікувану дату завершення розгляду."
  persuasion_b2_21: "Я не вважаю питання закритим, доки ці розбіжності не пояснено."
  persuasion_b2_22: "Пропоную коротку розмову, щоб узгодити прийнятне рішення."
  persuasion_b2_23: "З огляду на повторні затримки вважаю доцільним переглянути графік доставки."
  persuasion_b2_24: "Моє прохання ґрунтується на умовах, підтверджених у Вашому листі."
  persuasion_b2_25: "Будь ласка, врахуйте, що затримка спричинила додаткові витрати."
  persuasion_b2_26: "Якщо ремонт неможливий, прошу замінити товар."
  persuasion_b2_27: "Я був би готовий прийняти пізнішу доставку, якщо Ви письмово підтвердите нову дату."
  persuasion_b2_28: "Запропоноване рішення дозволило б завершити роботу без додаткових витрат."
  persuasion_b2_29: "Щоб уникнути подальших непорозумінь, прошу підтвердити всі умови письмово."
  persuasion_b2_30: "Сподіваюся, ми зможемо знайти рішення, прийнятне для обох сторін."
