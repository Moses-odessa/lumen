  summary_rethink_b2_01: "Якщо підсумувати, у нас більше спільного, ніж розбіжностей."
  summary_rethink_b2_02: "Обговорення показало, де саме наші погляди розходяться."
  summary_rethink_b2_03: "Я став краще розуміти іншу сторону."
  summary_rethink_b2_04: "Моя позиція змінилася не повністю, але стала точнішою."
  summary_rethink_b2_05: "Деякі питання поки що залишаються без відповіді."
  summary_rethink_b2_06: "Ми маємо достатньо інформації для наступного кроку."
  summary_rethink_b2_07: "Це рішення варто переглянути після пробного періоду."
  summary_rethink_b2_08: "Успіх залежатиме не лише від рішення, а й від виконання."
  summary_rethink_b2_09: "Заднім числом ситуація виглядає інакше."
  summary_rethink_b2_10: "Тоді ми діяли на основі доступної інформації."
  summary_rethink_b2_11: "Помилку варто визнати, але не повторювати."
  summary_rethink_b2_12: "Найціннішим результатом стала ясність щодо наступних кроків."
  summary_rethink_b2_13: "Я б розділив висновки на практичні та довгострокові."
  summary_rethink_b2_14: "Ми знайшли спільну основу, навіть якщо деталі ще не узгоджено."
  summary_rethink_b2_15: "Важливо відрізняти тимчасовий результат від стійкого покращення."
  summary_rethink_b2_16: "Я визнаю, що недооцінив складність завдання."
  summary_rethink_b2_17: "Це не скасовує нашого рішення, але змінює умови його виконання."
  summary_rethink_b2_18: "Тепер потрібно перевірити, чи правильно ми визначили причину."
  summary_rethink_b2_19: "Наступного разу варто залучити учасників раніше."
  summary_rethink_b2_20: "Домовленість має залишатися зрозумілою і тим, хто не був на зустрічі."
  summary_rethink_b2_21: "Я вдячний за заперечення: вони допомогли уточнити пропозицію."
  summary_rethink_b2_22: "Після завершення пробного етапу ми вирішимо, що зберегти, а що змінити."
  summary_rethink_b2_23: "Зваживши всі обставини, можна сказати, що пробний етап був корисним."
  summary_rethink_b2_24: "Хоча ми не домовилися про бюджет, ми визначили спільні пріоритети."
  summary_rethink_b2_25: "Найважливіше, чого я навчився, — перевіряти припущення до початку роботи."
  summary_rethink_b2_26: "Якби ми раніше уточнили вимоги, робота зараз уже була б завершена."
  summary_rethink_b2_27: "Замість того щоб шукати винних, слід з'ясувати, як запобігти повторенню помилки."
  summary_rethink_b2_28: "Незалежно від того, що покаже перевірка, ми опублікуємо результати."
  summary_rethink_b2_29: "Ми повернемося до цього питання, коли отримаємо відгуки учасників."
  summary_rethink_b2_30: "Пропоную завершити конкретною домовленістю: у п'ятницю ми разом перевіримо перші результати."
  symptoms_treatment_a2_01: "Це почалося три дні тому."
