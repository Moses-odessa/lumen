# Переклади фраз цілком: вони проявляються після того, як усі пропуски
# заповнені. Пропуск, заповнений правильно, але так і не пояснений, учить
# добирати форму й нічого більше.
#
# Перекладено моделлю, перевірено перехресно другою моделлю; носій мови не
# залучався (PLAN.md, «Вичитка»). Друга модель знайшла те, чого перша не
# бачила: німецькі слова, залишені без перекладу в українському рядку —
# саме те слово, якому картка й навчає, — кальки на кшталт «міське
# планування» замість «містобудування» і колізію термінів, де «збір» уже
# позначав Umlage.
phrases:
  # ── city / a0 ─────────────────────────────────
  city_a0_map: "На карті міста я знаходжу кожну вулицю."
  city_a0_post: "Де пошта? Мені потрібно надіслати лист."
