  cafe_food_a1_20: "Можна меншу порцію?"
  cafe_food_a1_21: "Соус окремо, будь ласка."
  cafe_food_a1_22: "Це не моє замовлення."
  cafe_food_a1_23: "Мій суп холодний."
  cafe_food_a1_24: "Можна серветку?"
  cafe_food_a1_25: "Ми замовляли два напої, а не три."
  cafe_food_a1_26: "Решту можна забрати із собою?"
  cafe_food_a1_27: "Я хотів би каву без молока."
  cafe_food_a1_28: "У вас є вівсяне молоко?"
  cafe_food_a1_29: "На сніданок я їм хліб із сиром."
  cafe_food_a1_30: "Я віддаю перевагу воді без газу."
  clarify_mediate_b1_01: "Якщо я правильно розумію, у нас два варіанти."
  clarify_mediate_b1_02: "Ти маєш на увазі сьогодні чи завтра?"
  clarify_mediate_b1_03: "Можеш висловити це іншими словами?"
  clarify_mediate_b1_04: "Я спробую пояснити простіше."
  clarify_mediate_b1_05: "Суть у тому, що нам потрібен час."
  clarify_mediate_b1_06: "Це не зовсім те, що я мав на увазі."
  clarify_mediate_b1_07: "Я поясню на прикладі."
  clarify_mediate_b1_08: "Давайте не змішувати ці два питання."
  clarify_mediate_b1_09: "Ми говоримо про ціну чи про якість?"
  clarify_mediate_b1_10: "Я коротко передам головну думку."
  clarify_mediate_b1_11: "Вона просить підтвердити час."
  clarify_mediate_b1_12: "Він не відмовляється, а просить уточнення."
  clarify_mediate_b1_13: "Можливо, проблема лише у формулюванні."
  clarify_mediate_b1_14: "Правильно я передав твою думку?"
  clarify_mediate_b1_15: "Що саме тобі незрозуміло?"
  clarify_mediate_b1_16: "Тепер ми однаково це розуміємо."
  clarify_mediate_b1_17: "Дозвольте перевірити, чи правильно я почув цифру."
  clarify_mediate_b1_18: "Вона має на увазі весь місяць, а не один тиждень."
  clarify_mediate_b1_19: "Я передам йому, що зустріч скасовано."
  clarify_mediate_b1_20: "Тут це слово має інше значення."
  clarify_mediate_b1_21: "У перекладі загубилася важлива деталь."
  clarify_mediate_b1_22: "Спробую передати зміст без спеціальних термінів."
  clarify_mediate_b1_23: "Можна розділити це запитання на дві частини?"
  clarify_mediate_b1_24: "Поясніть, будь ласка, на конкретній ситуації."
  clarify_mediate_b1_25: "Я перевірю у неї, чи вона погоджується."
  clarify_mediate_b1_26: "Не хочу говорити від його імені."
  clarify_mediate_b1_27: "Інакше кажучи, нам потрібен ще один день."
  clarify_mediate_b1_28: "Під «гнучким графіком» я маю на увазі можливість починати роботу пізніше."
  clarify_mediate_b1_29: "Чи правильно я зрозумів, що оплата вже включена?"
  clarify_mediate_b1_30: "Підсумовуючи сказане, спочатку ми перевіримо документи."
  comparison_conditions_a2_01: "Цей варіант мені більше підходить."
  comparison_conditions_a2_02: "Це дешевше, але далі."
  comparison_conditions_a2_03: "Для мене час важливіший за ціну."
  comparison_conditions_a2_04: "Обидва варіанти хороші."
  comparison_conditions_a2_05: "Я ще не вирішив."
  comparison_conditions_a2_06: "Це залежить від погоди."
  comparison_conditions_a2_07: "Я залишуся вдома, бо йде дощ."
  comparison_conditions_a2_08: "Якщо буде час, я прийду."
  comparison_conditions_a2_09: "Ми можемо почати без нього."
  comparison_conditions_a2_10: "Спочатку потрібно запитати."
  comparison_conditions_a2_11: "Краще зробити це зараз."
  comparison_conditions_a2_12: "Це не так складно, як здається."
  comparison_conditions_a2_13: "Мені потрібне щось простіше."
  comparison_conditions_a2_14: "Я обираю якість, а не кількість."
  comparison_conditions_a2_15: "Це можливо лише вранці."
  comparison_conditions_a2_16: "Іншого варіанта немає."
  comparison_conditions_a2_17: "У першого варіанта коротший строк очікування."
  comparison_conditions_a2_18: "Різниця в ціні невелика."
  comparison_conditions_a2_19: "Це підходить не всім."
  comparison_conditions_a2_20: "Що входить у дорожчий варіант?"
  comparison_conditions_a2_21: "Без підтвердження я не можу бронювати."
  comparison_conditions_a2_22: "Спочатку перевірмо, чи вистачить місця."
  comparison_conditions_a2_23: "Обидва квитки діють на той самий маршрут."
  comparison_conditions_a2_24: "Чим раніше ми почнемо, тим раніше закінчимо."
  comparison_conditions_a2_25: "За таку саму ціну тут пропонують більше."
  comparison_conditions_a2_26: "Я погоджуся, якщо можна буде змінити дату."
  comparison_conditions_a2_27: "Я обираю потяг, тому що він швидший."
  comparison_conditions_a2_28: "Якщо завтра буде дощ, ми залишимося вдома."
  comparison_conditions_a2_29: "Для мене здоров'я важливіше за роботу."
  comparison_conditions_a2_30: "Замість того щоб телефонувати, можна написати електронного листа."
  culture_impressions_b1_01: "Фільм справив на мене сильне враження."
  culture_impressions_b1_02: "Сюжет розвивається повільно."
  culture_impressions_b1_03: "Головний герой намагається змінити своє життя."
  culture_impressions_b1_04: "Історія заснована на реальних подіях."
  culture_impressions_b1_05: "Мені сподобалася атмосфера."
  culture_impressions_b1_06: "Кінець був несподіваним."
  culture_impressions_b1_07: "Я не хочу розкривати кінцівку."
  culture_impressions_b1_08: "Книга змусила мене замислитися."
  culture_impressions_b1_09: "Деякі сцени здалися мені нереалістичними."
  culture_impressions_b1_10: "Музика добре підходить до історії."
  culture_impressions_b1_11: "Я порекомендував би це друзям."
  culture_impressions_b1_12: "Це не зовсім на мій смак."
  culture_impressions_b1_13: "Я зазвичай читаю в оригіналі."
  culture_impressions_b1_14: "Субтитри допомагають мені розуміти діалоги."
  culture_impressions_b1_15: "Яку думку хотів передати автор?"
  culture_impressions_b1_16: "Кожен може зрозуміти це по-своєму."
  culture_impressions_b1_17: "Я зазвичай обираю документальні фільми."
  culture_impressions_b1_18: "Ця сцена здалася мені особливо правдоподібною."
  culture_impressions_b1_19: "Я не одразу зрозумів гумор."
  culture_impressions_b1_20: "Мені забракло пояснення контексту."
  culture_impressions_b1_21: "Після вистави можна поставити запитання акторам."
  culture_impressions_b1_22: "Ця виставка змусила мене подивитися на місто інакше."
  culture_impressions_b1_23: "Я хотів би прочитати рецензію після перегляду."
  culture_impressions_b1_24: "Живий виступ справляє зовсім інше враження."
  culture_impressions_b1_25: "Деякі культурні відсилання були мені незнайомі."
  culture_impressions_b1_26: "Ми по-різному зрозуміли останню сцену."
  culture_impressions_b1_27: "Фільм розповідає про сім'ю, яка переїжджає в іншу країну."
  culture_impressions_b1_28: "Найбільше мене вразила гра головної актриси."
  culture_impressions_b1_29: "На відміну від книжки, у фільмі дія відбувається взимку."
  culture_impressions_b1_30: "Я б порадив цю книжку тим, хто любить історії про подорожі."
  daily_routine_a1_01: "Я встаю о сьомій."
  daily_routine_a1_02: "Спочатку я снідаю."
  daily_routine_a1_03: "Потім я йду на роботу."
  daily_routine_a1_04: "Я працюю з дому."
  daily_routine_a1_05: "Опівдні в мене перерва."
  daily_routine_a1_06: "Я повертаюся додому о шостій."
  daily_routine_a1_07: "Увечері я готую."
  daily_routine_a1_08: "Я рано лягаю спати."
  daily_routine_a1_09: "Я роблю це щодня."
  daily_routine_a1_10: "Зазвичай я їжджу автобусом."
  daily_routine_a1_11: "Іноді я ходжу пішки."
  daily_routine_a1_12: "У неділю я не працюю."
  daily_routine_a1_13: "Коли ти снідаєш?"
  daily_routine_a1_14: "Як часто ти готуєш?"
  daily_routine_a1_15: "Сьогодні я маю багато справ."
  daily_routine_a1_16: "Я ще не закінчив."
  daily_routine_a1_17: "Мені потрібно прибрати кімнату."
  daily_routine_a1_18: "Сьогодні моя черга мити посуд."
  daily_routine_a1_19: "Пральна машина ще працює."
  daily_routine_a1_20: "Я виношу сміття ввечері."
  daily_routine_a1_21: "Дорога до роботи займає пів години."
  daily_routine_a1_22: "Я обідаю з колегами."
  daily_routine_a1_23: "Після обіду я часто втомлений."
  daily_routine_a1_24: "Сьогодні в мене вихідний."
  daily_routine_a1_25: "Я не дивлюся телевізор під час їжі."
  daily_routine_a1_26: "Будильник дзвонить о шостій."
  daily_routine_a1_27: "Щоранку я п'ю каву."
  daily_routine_a1_28: "Після роботи я йду до магазину."
  daily_routine_a1_29: "Перед сном я читаю книжку."
  daily_routine_a1_30: "На вихідних ми гуляємо в парку."
  digital_life_a2_01: "Я не можу увійти в акаунт."
  digital_life_a2_02: "Я забув пароль."
  digital_life_a2_03: "Як скинути пароль?"
  digital_life_a2_04: "Код підтвердження не надійшов."
  digital_life_a2_05: "Посилання більше не працює."
  digital_life_a2_06: "Файл занадто великий."
  digital_life_a2_07: "Можеш надіслати це як PDF?"
  digital_life_a2_08: "Мене добре чути?"
  digital_life_a2_09: "У мене вимкнений мікрофон."
  digital_life_a2_10: "Зображення зависло."
  digital_life_a2_11: "Я підключуся ще раз."
  digital_life_a2_12: "Чи потрібно встановити оновлення?"
  digital_life_a2_13: "Я зробив резервну копію."
  digital_life_a2_14: "Не надсилай мені свій пароль."
  digital_life_a2_15: "Я не знаю відправника."
  digital_life_a2_16: "Я хочу вимкнути сповіщення."
  digital_life_a2_17: "Я випадково видалив фото."
  digital_life_a2_18: "Чи можна відновити цей файл?"
  digital_life_a2_19: "Я хочу видалити свій обліковий запис."
  digital_life_a2_20: "Як вийти з облікового запису на інших пристроях?"
  digital_life_a2_21: "Цей застосунок безкоштовний чи платний?"
  digital_life_a2_22: "Я не хочу продовжувати пробну підписку."
  digital_life_a2_23: "Чому застосунку потрібен доступ до камери?"
  digital_life_a2_24: "Я ввімкнув двофакторну автентифікацію."
  digital_life_a2_25: "Мені бракує місця на телефоні."
  digital_life_a2_26: "Я не можу приєднатися до відеодзвінка."
  digital_life_a2_27: "У мене не виходить завантажити фото."
  digital_life_a2_28: "На екрані написано: «Неправильний пароль»."
  digital_life_a2_29: "Де можна змінити мову?"
  digital_life_a2_30: "Я отримав повідомлення про затримку доставки."
  ecology_decisions_b2_01: "Екологічні заходи мають бути справедливими й фінансово доступними."
  ecology_decisions_b2_02: "Потрібно враховувати повний життєвий цикл продукту."
  ecology_decisions_b2_03: "Низька ціна не завжди відображає справжню вартість."
  ecology_decisions_b2_04: "Хто нестиме витрати переходу?"
  ecology_decisions_b2_05: "Особистий вибір важливий, але не замінює системних змін."
  ecology_decisions_b2_06: "Довгострокова вигода може перевищити початкові витрати."
  ecology_decisions_b2_07: "Нам потрібні вимірювані цілі."
  ecology_decisions_b2_08: "Як ми перевіримо, чи працює цей захід?"
  ecology_decisions_b2_09: "Не слід просто переносити проблему в інше місце."
  ecology_decisions_b2_10: "Обіцяний ефект залежить від умов використання."
  ecology_decisions_b2_11: "Потрібно відрізняти реальні зміни від реклами."
  ecology_decisions_b2_12: "Можливі наслідки бездіяльності теж мають ціну."
  ecology_decisions_b2_13: "Потрібно врахувати вплив виробництва, а не лише використання."
  ecology_decisions_b2_14: "Як довго виріб має служити, щоб заміна була виправданою?"
  ecology_decisions_b2_15: "Ця оцінка не враховує транспортування."
  ecology_decisions_b2_16: "Місцеве виробництво саме по собі не гарантує меншого впливу."
  ecology_decisions_b2_17: "Слід перевірити, що саме означає цей екологічний знак."
  ecology_decisions_b2_18: "Заощадження можуть зникнути, якщо споживання зросте."
  ecology_decisions_b2_19: "Хто контролюватиме виконання екологічних зобов'язань?"
  ecology_decisions_b2_20: "План має містити проміжні цілі, які можна перевірити."
  ecology_decisions_b2_21: "Зміни не повинні перекладати весь тягар на споживачів."
  ecology_decisions_b2_22: "Порівняння має враховувати однаковий строк використання."
  ecology_decisions_b2_23: "Порівнюючи ремонт і заміну, потрібно врахувати витрати ресурсів."
  ecology_decisions_b2_24: "Екологічна користь зникає, якщо нова система споживає більше ресурсів, ніж заощаджує."
  ecology_decisions_b2_25: "Перехід на електробуси потребуватиме нової зарядної інфраструктури."
  ecology_decisions_b2_26: "Щоб не посилювати нерівність, слід підтримати сім'ї з низькими доходами."
  ecology_decisions_b2_27: "Залежно від місцевих умов результат може суттєво відрізнятися."
  ecology_decisions_b2_28: "Витрати на утеплення слід порівняти з очікуваною економією енергії."
  ecology_decisions_b2_29: "Без змін у транспортній системі нам навряд чи вдасться суттєво скоротити затори."
  ecology_decisions_b2_30: "Цей захід матиме сенс лише тоді, коли мешканці зможуть скористатися запропонованою альтернативою."
  ecology_mobility_b1_01: "Я намагаюся менше користуватися автомобілем."
  ecology_mobility_b1_02: "Громадський транспорт тут зручний."
  ecology_mobility_b1_03: "На велосипеді я часто дістаюся швидше."
  ecology_mobility_b1_04: "Не всюди можна обійтися без машини."
  ecology_mobility_b1_05: "Я беру багаторазову пляшку."
  ecology_mobility_b1_06: "Ми сортуємо сміття вдома."
  ecology_mobility_b1_07: "Куди викидати цю упаковку?"
  ecology_mobility_b1_08: "Краще відремонтувати, ніж викинути."
  ecology_mobility_b1_09: "Я купую лише те, що мені потрібно."
  ecology_mobility_b1_10: "Ми викидаємо занадто багато їжі."
  ecology_mobility_b1_11: "Це економить і гроші, і ресурси."
  ecology_mobility_b1_12: "Невеликі зміни теж мають значення."
  ecology_mobility_b1_13: "Людям потрібні доступні альтернативи."
  ecology_mobility_b1_14: "Я хочу дізнатися, звідки цей продукт."
  ecology_mobility_b1_15: "Тут потрібно більше зелених зон."
  ecology_mobility_b1_16: "Важливо думати не лише про сьогодні."
  ecology_mobility_b1_17: "Я планую покупки, щоб менше викидати."
  ecology_mobility_b1_18: "Цю упаковку можна використати повторно."
  ecology_mobility_b1_19: "Де можна здати старі батарейки?"
  ecology_mobility_b1_20: "Ми організовуємо обмін речами в нашому районі."
  ecology_mobility_b1_21: "Я намагаюся об'єднувати кілька справ в одну поїздку."
  ecology_mobility_b1_22: "Увечері автобуси ходять надто рідко."
  ecology_mobility_b1_23: "Потрібне безпечне місце для зберігання велосипедів."
  ecology_mobility_b1_24: "Ремонт коштує майже стільки ж, скільки нова річ."
  ecology_mobility_b1_25: "Я хотів би менше залежати від автомобіля."
  ecology_mobility_b1_26: "Чи можна позичити інструмент замість того, щоб купувати?"
  ecology_mobility_b1_27: "Щоб економити воду, я приймаю коротший душ."
  ecology_mobility_b1_28: "Якби було більше велодоріжок, люди могли б безпечніше їздити на велосипеді."
  ecology_mobility_b1_29: "Проблема не лише в ціні, а й у доступності транспорту."
