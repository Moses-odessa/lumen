  letters_requests_b1_19: "Надсилаю виправлену версію документа."
  letters_requests_b1_20: "Для цього потрібен оригінал чи достатньо копії?"
  letters_requests_b1_21: "Прошу продовжити строк подання документів."
  letters_requests_b1_22: "З якою метою потрібна ця інформація?"
  letters_requests_b1_23: "Чи можна подати заяву онлайн?"
